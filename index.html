<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koppal - Kids | Learn English with Kannada 🌟</title>
<!-- Google Fonts: Baloo 2 for main text, Noto Sans Kannada for Kannada text -->
<link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Noto+Sans+Kannada:wght@400;700&display=swap)" rel="stylesheet">
<style>
/* 
  =========================
  GLOBAL STYLES & LAYOUT
  =========================
*/

/* Custom CSS Variables for easy color changes throughout the site */
:root {
  --sky:#FFF8E7; /* Light background color */
  --yellow:#FFD93D;
  --orange:#FF6B35;
  --pink:#FF85A1;
  --green:#6BCB77;
  --blue:#4D96FF;
  --purple:#C77DFF;
  --red:#FF4D6D;
  --teal:#2EC4B6;
  --white:#ffffff;
  --dark:#2B2D42; /* Dark text/border color */
}

/* Reset default browser margins and paddings */
* { margin:0; padding:0; box-sizing:border-box; }

/* Body styles: font, background color, and decorative background gradients */
body {
  font-family:'Baloo 2',cursive; /* Main font for the site */
  background:var(--sky); /* Background color from custom variable */
  min-height:100vh; /* Make sure body takes at least full viewport height */
  overflow-x:hidden; /* Prevent horizontal scrolling */
  background-image: /* Decorative circles in the background */
    radial-gradient(circle at 10% 10%,#FFD93D44 80px,transparent 80px),
    radial-gradient(circle at 90% 15%,#FF85A144 60px,transparent 60px),
    radial-gradient(circle at 80% 85%,#6BCB7744 70px,transparent 70px),
    radial-gradient(circle at 20% 80%,#4D96FF44 55px,transparent 55px);
}

/* 
  =========================
  HEADER SECTION
  =========================
*/

/* Header layout for aligning the kids' images and title */
#mainHeader { padding: 20px; } /* Padding around the header content */
.header-row {
  display: flex; /* Use flexbox for horizontal alignment */
  align-items: center; /* Vertically center items */
  justify-content: space-between; /* Distribute space between items (kids and title) */
  gap: 10px; /* Space between items */
}

/* Style for the central title block */
.title-block { text-align: center; flex: 1; } /* Center text, allow to grow */
.title-block h1 { margin: 0; } /* Remove default margin for h1 */

/* Styles for the "hero" kid images */
.hero-img {
  width: 100px; height: 100px; /* Size of the images */
  object-fit: cover; /* Crop image to fit */
  border-radius: 50%; /* Make images circular */
  border: 4px solid #fff; /* White border */
  box-shadow: 0 6px 14px rgba(0,0,0,0.2); /* Soft shadow */
  animation: float 5s ease-in-out infinite; /* Apply floating animation */
  flex-shrink: 0; /* Prevent images from shrinking on smaller screens */
}

/* Keyframe animation for the floating effect of the kid images */
@keyframes float {
  0%{transform:translateY(0);} /* Start at normal position */
  50%{transform:translateY(-10px);} /* Move up 10px */
  100%{transform:translateY(0);} /* Return to normal position */
}

/* Responsive adjustments for header on smaller screens (e.g., mobile) */
@media (max-width: 768px) {
  .header-row { flex-direction: row; align-items: center; justify-content: space-between; gap: 6px; }
  .hero-img {
    width:14vw; height:14vw; /* Image size relative to viewport width */
    min-width:45px; min-height:45px; /* Minimum size */
    max-width:70px; max-height:70px; /* Maximum size */
    flex-shrink:0;
  }
  .title-block { flex:1; text-align:center; padding:0 5px; }
  .title-block h1 { font-size:5vw; margin:0; line-height:1.2; } /* Responsive font size for h1 */
  .title-block p { font-size:3.2vw; line-height:1.3; } /* Responsive font size for paragraphs */
}

/* Header specific styles and animations */
header { text-align:center; padding:28px 20px 8px; position:relative; overflow:hidden; }

/* Styles for the small "sparkle" elements that float around the header */
.spark { position:absolute; border-radius:50%; pointer-events:none; animation:sparkFloat linear infinite; }
/* Keyframe animation for the floating sparkles */
@keyframes sparkFloat {
  0%{transform:translateY(0) scale(1) rotate(0deg);opacity:0;}
  20%{opacity:1;}
  80%{opacity:1;}
  100%{transform:translateY(-120px) scale(0.3) rotate(360deg);opacity:0;}
}

/* Wrapper for the main title to allow for effects */
.title-wrap { position:relative; display:inline-block; }

/* Main title (h1) styling with gradient text, shadow, and animations */
header h1 {
  font-size:clamp(2rem,6vw,3.4rem); /* Responsive font size */
  font-weight:800; /* Extra bold */
  letter-spacing:2px; /* Spacing between letters */
  background:linear-gradient(135deg,#FF6B35 0%,#FFD93D 40%,#FF85A1 70%,#C77DFF 100%); /* Colorful gradient */
  -webkit-background-clip:text; /* Clip background to text shape (for gradient text) */
  -webkit-text-fill-color:transparent; /* Make text color transparent to show background gradient */
  background-clip:text; /* Standard property for clipping background to text */
  background-size:200% auto; /* Make gradient wider for animation */
  animation:titleShine 3s linear infinite,titleBounce 2s ease-in-out infinite; /* Apply shine and bounce animations */
  filter:drop-shadow(0 4px 8px #FF6B3544); /* Soft drop shadow */
  position:relative;
}
/* Keyframe animation for the title's shining effect */
@keyframes titleShine {
  0%{background-position:0% center;}
  100%{background-position:200% center;}
}
/* Keyframe animation for the title's subtle bounce effect */
@keyframes titleBounce {
  0%,100%{transform:translateY(0) scale(1);} /* Start and end at normal position */
  50%{transform:translateY(-4px) scale(1.02);} /* Move up slightly and scale a bit */
}

/* Styling for the star emojis within the title */
.title-star { display:inline-block; animation:starSpin 2s ease-in-out infinite; font-size:clamp(1.4rem,4vw,2rem); }
.title-star:nth-child(1){animation-delay:0s;} /* Animation delay for the first star */
.title-star:nth-child(3){animation-delay:0.5s;} /* Animation delay for the third star */
/* Keyframe animation for the spinning star effect */
@keyframes starSpin {
  0%,100%{transform:rotate(-15deg) scale(1);}
  50%{transform:rotate(15deg) scale(1.3);}
}

/* Styles for header paragraphs (e.g., "Learn English with Kannada") */
header p { font-size:1.05rem; color:var(--dark); margin-top:5px; font-weight:600; animation:fadeSlideUp 0.8s ease both; }
/* Keyframe animation for text fading and sliding up */
@keyframes fadeSlideUp {
  from{opacity:0;transform:translateY(10px);} /* Start invisible and slightly down */
  to{opacity:1;transform:translateY(0);} /* End fully visible and at normal position */
}

/* 
  =========================
  FOOTER SECTION
  =========================
*/

/* Styles for the "Gavisiddappa HATTI" credit name with animated gradient */
.credit-name {
  display:inline-block; font-weight:800; font-size:1rem;
  background:linear-gradient(90deg,#FF6B35,#FFD93D,#FF85A1,#C77DFF,#4D96FF,#FF6B35); /* Gradient colors */
  background-size:300% auto; /* Make gradient wider for animation */
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text; animation:nameShine 2.5s linear infinite; /* Apply shining animation */
  position:relative;
}
/* Keyframe animation for the shining name effect */
@keyframes nameShine {
  0%{background-position:0% center;}
  100%{background-position:300% center;}
}
/* After effect for the credit name (adds a sparkling emoji) */
.credit-name::after { content:' ✨'; animation:sparkle 1.5s ease-in-out infinite; -webkit-text-fill-color:initial; font-size:0.85rem; }
/* Keyframe animation for the sparkle effect */
@keyframes sparkle {
  0%,100%{opacity:1;transform:scale(1) rotate(0deg);}
  50%{opacity:0.6;transform:scale(1.4) rotate(20deg);}
}

/* Footer general styles */
footer { text-align:center; padding:20px 14px 14px; font-size:0.9rem; font-weight:600; color:#aaa; position:relative; }

/* Animation for the heart emoji in the footer */
.footer-hearts { display:inline-block; animation:heartBeat 1s ease-in-out infinite; }
/* Keyframe animation for the heart beat effect */
@keyframes heartBeat {
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.3);}
}

/* 
  =========================
  MODE TABS (A-Z, Words, Sentences, Quiz)
  =========================
*/

/* Container for mode selection tabs */
.mode-tabs {
  display:flex; flex-wrap:wrap; /* Allow tabs to wrap if space is limited */
  justify-content:center; /* Center tabs horizontally */
  gap:10px; /* Space between tabs */
  padding:16px 16px 6px;
}

/* Individual mode tab button styles */
.mode-tab {
  background:var(--white); border:3px solid var(--dark); border-radius:50px; /* Rounded pill shape */
  padding:9px 22px; font-family:'Baloo 2',cursive; font-size:1rem; font-weight:800;
  cursor:pointer; box-shadow:4px 4px 0 var(--dark); /* "Pressed" shadow effect */
  transition:all 0.15s; /* Smooth transition for hover effects */
  color:var(--dark);
}

/* Hover effect for mode tabs: lift and larger shadow */
.mode-tab:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--dark); }

/* Active mode tab (currently selected) styles */
.mode-tab.active {
  background:var(--dark); /* Dark background */
  color:#fff; /* White text */
  transform:translate(-2px,-2px); /* Lift effect */
  box-shadow:6px 6px 0 var(--orange); /* Orange shadow for active state */
}

/* 
  =========================
  SCORE BAR (Stars)
  =========================
*/

/* Score bar display */
.score-bar { text-align:center; padding:6px; font-size:1.1rem; font-weight:700; color:var(--dark); }
/* Individual star animation when collected */
.star { font-size:1.3rem; animation:spin 0.5s ease; display:inline-block; }
/* Keyframe animation for star spin effect */
@keyframes spin {
  from{transform:rotate(0deg) scale(0);} /* Start invisible and rotated */
  to{transform:rotate(360deg) scale(1);} /* End visible and normal rotation */
}

/* 
  =========================
  CATEGORY BAR (Words Section)
  =========================
*/

/* Container for word category buttons */
.category-bar {
  display:flex; flex-wrap:wrap; justify-content:center; gap:10px; padding:14px 16px 8px;
}

/* Individual category button styles */
.cat-btn {
  background:var(--white); border:3px solid var(--dark); border-radius:50px;
  padding:7px 18px; font-family:'Baloo 2',cursive; font-size:0.95rem; font-weight:700;
  cursor:pointer; transition:all 0.2s; box-shadow:3px 3px 0 var(--dark); color:var(--dark);
}

/* Hover/active effects for category buttons */
.cat-btn:hover,.cat-btn.active { transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--dark); }
.cat-btn.active { color:#fff; } /* White text for active button */

/* Specific background colors for active category buttons */
.cat-btn[data-cat="Animals"].active  { background:var(--green); }
.cat-btn[data-cat="Fruits"].active   { background:var(--orange); }
.cat-btn[data-cat="Vegetables"].active{background:var(--teal); }
.cat-btn[data-cat="Colors"].active   { background:var(--purple); }
.cat-btn[data-cat="Body"].active     { background:var(--pink); }
.cat-btn[data-cat="Home"].active     { background:var(--blue); }
.cat-btn[data-cat="Food"].active     { background:var(--red); }
.cat-btn[data-cat="Birds"].active    { background:#00B4D8; }
.cat-btn[data-cat="Flowers"].active  { background:#E040FB; }
.cat-btn[data-cat="Festivals"].active{ background:#FF9800; }
.cat-btn[data-cat="Numbers"].active  { background:#F72585; }
.cat-btn[data-cat="Transport"].active{ background:#3D5A80; }
.cat-btn[data-cat="Games"].active    { background:#FFB703; }

/* 
  =========================
  WORD GRID (Words Section)
  =========================
*/

/* Grid container for word cards */
.grid {
  display:grid; /* Use grid layout */
  grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); /* Responsive columns */
  gap:16px; /* Space between grid items */
  padding:16px 18px 36px;
  max-width:920px; /* Max width for the grid */
  margin:0 auto; /* Center the grid */
}

/* Individual word card styles */
/* WORD CARD BACKGROUND - CUSTOM */
//.card {
  //background:var(--white); border:3px solid var(--dark); border-radius:20px;
  //padding:16px 10px 13px; text-align:center; cursor:pointer;
  //box-shadow:5px 5px 0 var(--pink); transition:transform 0.15s,box-shadow 0.15s;
  //position:relative; overflow:hidden;
  //animation:popIn 0.4s cubic-bezier(.36,1.4,.64,1) both; /* Pop-in animation on load */
//}
/*=============================================================================================*/
.card {
  /* Animated Gradient Background */
  background: linear-gradient(45deg, var(--white));
  background-size: 400% 400%; /* For smooth gradient animation */
  
  /* Smooth rounded border */
  border: 3px solid var(--dark);
  border-radius: 20px;

  padding: 16px 12px;
  text-align: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;

  /* Shadow & hover transition */
  box-shadow: 5px 5px 0 var(--purple);
  transition: transform 0.2s ease, box-shadow 0.2s ease;

  /* Pop-in animation & background flash */
  animation: popIn 0.5s cubic-bezier(.36,1.4,.64,1) both, flashBG 6s linear infinite;
}

/* Hover effect */
.card:hover {
  transform: translateY(-6px) scale(1.03);
  box-shadow: 8px 8px 0 var(--white);
}

/* Pop-in keyframes */
@keyframes popIn {
  0% { transform: scale(0.7); opacity: 0; }
  80% { transform: scale(1.05); opacity: 1; }
  100% { transform: scale(1); }
}

/* Animated flashing background */
@keyframes flashBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/*==============================================================================================*/

/* Hover effects for word cards */
.card:hover { transform:translate(-3px,-3px); box-shadow:8px 8px 0 var(--dark); }
/* Active (click) effect for word cards */
.card:active { transform:translate(2px,2px); box-shadow:2px 2px 0 var(--dark); }
/* Bounce effect for cards (used after click) */
.card.bounce { animation:bounce 0.4s cubic-bezier(.36,1.6,.64,1); }

/* Keyframe animation for card pop-in effect */
@keyframes popIn {
  from{opacity:0;transform:scale(0.6) translateY(20px);}
  to{opacity:1;transform:scale(1) translateY(0);}
}
/* Keyframe animation for card bounce effect */
@keyframes bounce {
  0%{transform:scale(1);}
  40%{transform:scale(1.18) translate(-3px,-3px);}
  70%{transform:scale(0.95);}
  100%{transform:scale(1);}
}

/* Styles for the emoji in word cards */
.card-emoji { font-size:2.8rem; display:block; margin-bottom:7px; line-height:1; }
/* Styles for English text in word cards */
.card-en { font-size:1.05rem; font-weight:800; color:var(--dark); margin-bottom:3px; }
/* Styles for Kannada text in word cards */
.card-kn { font-family:'Noto Sans Kannada',sans-serif; font-size:0.95rem; font-weight:700; color:var(--orange); }
/* Badge on word cards (shows first letter of category) */
.card-badge { position:absolute; top:7px; right:8px; font-size:0.65rem; font-weight:800; padding:2px 7px; border-radius:20px; border:2px solid var(--dark); color:#fff; }
/* Color swatch for "Colors" category cards */
.swatch { width:46px; height:46px; border-radius:50%; border:3px solid var(--dark); margin:0 auto 7px; display:flex; align-items:center; justify-content:center; font-size:1.3rem; }

/* 
  =========================
  SENTENCES SECTION
  =========================
*/

/* Sentences section container (hidden by default) */
#sentencesSection { display:none; max-width:860px; margin:0 auto; padding:10px 18px 40px; }
/* Class to show sentences section */
#sentencesSection.show { display:block; }

/* Category bar for sentences */
.sent-cat-bar { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; padding:10px 0 16px; }

/* Individual sentence category button styles */
.sent-cat-btn {
  background:var(--white); border:3px solid var(--dark); border-radius:50px;
  padding:7px 16px; font-family:'Baloo 2',cursive; font-size:0.9rem; font-weight:700;
  cursor:pointer; box-shadow:3px 3px 0 var(--dark); transition:all 0.2s; color:var(--dark);
}

/* Hover/active effects for sentence category buttons */
.sent-cat-btn:hover,.sent-cat-btn.active { transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--dark); }
.sent-cat-btn.active { color:#fff; } /* White text for active button */

/* Specific background colors for active sentence category buttons */
.sent-cat-btn[data-scat="Animals & Nature"].active { background:var(--green); }
.sent-cat-btn[data-scat="Family & People"].active  { background:var(--pink); }
.sent-cat-btn[data-scat="Food & Eating"].active    { background:var(--orange); }
.sent-cat-btn[data-scat="School & Playing"].active { background:var(--blue); }
.sent-cat-btn[data-scat="Vegetables & Fruits"].active{ background:var(--teal); }
.sent-cat-btn[data-scat="Birds & Flowers"].active  { background:#E040FB; }
.sent-cat-btn[data-scat="Festivals 🎉"].active     { background:#FF9800; }
.sent-cat-btn[data-scat="Numbers 🔢"].active       { background:#F72585; }
.sent-cat-btn[data-scat="Transport 🚗"].active     { background:#3D5A80; }

/* List container for sentence cards */
.sent-list { display:flex; flex-direction:column; gap:14px; }

/* Individual sentence card styles */
.sent-card {
  background:var(--white); border:3px solid var(--dark); border-radius:18px;
  padding:14px 18px; box-shadow:5px 5px 0 var(--dark); cursor:pointer;
  transition:transform 0.15s,box-shadow 0.15s;
  animation:popIn 0.35s cubic-bezier(.36,1.4,.64,1) both;
  display:flex; align-items:center; gap:14px;
}

/* Hover/active effects for sentence cards */
.sent-card:hover { transform:translate(-3px,-3px); box-shadow:8px 8px 0 var(--dark); }
.sent-card:active { transform:translate(2px,2px); box-shadow:2px 2px 0 var(--dark); }
/* Bounce effect for sentence cards (used after click) */
.sent-card.bounce { animation:bounce 0.4s cubic-bezier(.36,1.6,.64,1); }

/* Styles for emoji in sentence cards */
.sent-emoji { font-size:2.2rem; flex-shrink:0; }
/* Text content container in sentence cards */
.sent-text { flex:1; }
/* English text in sentence cards */
.sent-en { font-size:1.1rem; font-weight:800; color:var(--dark); margin-bottom:4px; }
/* Kannada text in sentence cards */
.sent-kn { font-family:'Noto Sans Kannada',sans-serif; font-size:0.98rem; font-weight:700; color:var(--orange); margin-bottom:3px; }
/* Pronunciation text in sentence cards */
.sent-pronun { font-size:0.82rem; color:#999; font-style:italic; }

/* "Say!" button in sentence cards */
.sent-say {
  background:var(--yellow); border:2px solid var(--dark); border-radius:30px;
  padding:6px 14px; font-family:'Baloo 2',cursive; font-size:0.88rem; font-weight:700;
  cursor:pointer; box-shadow:2px 2px 0 var(--dark); flex-shrink:0;
  transition:all 0.15s;
}
/* Hover effect for "Say!" button */
.sent-say:hover { transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--dark); }

/* 
  =========================
  MODAL (Popup for words)
  =========================
*/

/* Modal overlay (background behind the popup) */
.modal-overlay {
  display:none; /* Hidden by default */
  position:fixed; inset:0; /* Cover the whole screen */
  background:#0007; /* Semi-transparent black background */
  z-index:100; /* Ensure it's on top of other content */
  align-items:center; justify-content:center; /* Center the modal content */
}
/* Class to show the modal overlay */
.modal-overlay.show { display:flex; }

/* Main modal dialog box styles */
.modal {
  background:#fff; border:4px solid var(--dark); border-radius:28px;
  padding:30px 26px; text-align:center; max-width:340px; width:90%;
  box-shadow:8px 8px 0 var(--dark);
  animation:popIn 0.3s cubic-bezier(.36,1.4,.64,1); /* Pop-in animation */
}

/* Styles for emoji in the modal */
.modal-emoji { font-size:4.5rem; display:block; margin-bottom:10px; }
/* English text in the modal */
.modal-en { font-size:1.9rem; font-weight:800; color:var(--dark); }
/* Kannada text in the modal */
.modal-kn { font-family:'Noto Sans Kannada',sans-serif; font-size:1.5rem; font-weight:700; color:var(--orange); margin:5px 0 3px; }
/* Pronunciation text in the modal */
.modal-pronun { font-size:0.95rem; color:#777; margin-bottom:18px; }

/* Close button for the modal */
.close-btn {
  background:var(--pink); border:3px solid var(--dark); border-radius:50px;
  padding:9px 24px; font-family:'Baloo 2',cursive; font-size:1rem; font-weight:800;
  cursor:pointer; color:#fff; box-shadow:4px 4px 0 var(--dark);
  transition:all 0.15s;
}
/* Hover effect for modal close button */
.close-btn:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--dark); }

/* 
  =========================
  ALPHABET SECTION
  =========================
*/

/* Alphabet section container (hidden by default) */
#alphabetSection { display:none; max-width:920px; margin:0 auto; padding:10px 18px 40px; }
/* Class to show alphabet section */
#alphabetSection.show { display:block; }

/* Grid container for alphabet cards */
#alphabetGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:14px; padding:10px 0; }

/* Individual alphabet card styles */
.alpha-card {
  background:#fff; border:3px solid var(--dark); border-radius:20px;
  padding:14px 10px 12px; text-align:center; cursor:pointer;
  box-shadow:5px 5px 0 var(--dark); transition:transform 0.15s,box-shadow 0.15s;
  animation:popIn 0.4s cubic-bezier(.36,1.4,.64,1) both;
}

/* Hover/active effects for alphabet cards */
.alpha-card:hover { transform:translate(-3px,-3px); box-shadow:8px 8px 0 var(--dark); }
.alpha-card:active { transform:translate(2px,2px); box-shadow:2px 2px 0 var(--dark); }
/* Bounce effect for alphabet cards (used after click) */
.alpha-card.bounce { animation:bounce 0.4s cubic-bezier(.36,1.6,.64,1); }

/* Styles for the large letter in alphabet cards */
.alpha-letter {
  font-size:2.4rem; font-weight:800; line-height:1;
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  margin-bottom:4px; display:block;
}
/* Styles for emoji in alphabet cards */
.alpha-emoji { font-size:1.8rem; display:block; margin-bottom:4px; }
/* Styles for English word in alphabet cards */
.alpha-word { font-size:0.9rem; font-weight:800; color:var(--dark); }
/* Styles for Kannada word in alphabet cards */
.alpha-kn { font-family:'Noto Sans Kannada',sans-serif; font-size:0.8rem; font-weight:700; color:var(--orange); }

/* 
  =========================
  QUIZ SECTION
  =========================
*/

/* Quiz section container (hidden by default) */
#quizSection { display:none; max-width:600px; margin:0 auto; padding:10px 18px 40px; }
/* Class to show quiz section */
#quizSection.show { display:block; }

/* Row for quiz score pills */
.quiz-score-row { display:flex; justify-content:center; gap:16px; margin-bottom:14px; flex-wrap:wrap; }
/* Individual quiz score pills (correct, wrong, total) */
.quiz-score-pill { background:#fff; border:3px solid var(--dark); border-radius:50px; padding:6px 20px; font-weight:800; font-size:0.95rem; box-shadow:3px 3px 0 var(--dark); }
/* Specific colors for quiz score pills */
.quiz-score-pill.correct { color:var(--green); }
.quiz-score-pill.wrong   { color:var(--red); }
.quiz-score-pill.total   { color:var(--blue); }

/* Quiz category selection buttons container */
.quiz-cat-select { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:18px; }
/* Individual quiz category button styles */
.quiz-cat-btn {
  background:#fff; border:2px solid var(--dark); border-radius:50px;
  padding:5px 14px; font-family:'Baloo 2',cursive; font-size:0.85rem; font-weight:700;
  cursor:pointer; box-shadow:2px 2px 0 var(--dark); transition:all 0.15s; color:var(--dark);
}
/* Active quiz category button styles */
.quiz-cat-btn.active { background:var(--dark); color:#fff; }
/* Hover effect for quiz category buttons */
.quiz-cat-btn:hover { transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--dark); }

/* Quiz card (displays question) */
.quiz-card { background:#fff; border:3px solid var(--dark); border-radius:24px; padding:28px 20px 22px; text-align:center; box-shadow:6px 6px 0 var(--dark); animation:popIn 0.4s cubic-bezier(.36,1.4,.64,1); }
/* Label for quiz question ("What is this in English?") */
.quiz-question-label { font-size:0.78rem; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:#aaa; margin-bottom:10px; }
/* Emoji for quiz question */
.quiz-emoji { font-size:5rem; display:block; margin-bottom:12px; }
/* Kannada text for quiz question */
.quiz-kn { font-family:'Noto Sans Kannada',sans-serif; font-size:1.5rem; font-weight:700; color:var(--orange); margin-bottom:6px; }
/* Hint text for quiz question */
.quiz-hint { font-size:0.85rem; color:#aaa; margin-bottom:20px; font-style:italic; }
/* Grid for quiz answer options */
.quiz-options { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:10px; }
/* Individual quiz option button styles */
.quiz-opt {
  background:#fff; border:3px solid var(--dark); border-radius:16px;
  padding:14px 10px; font-family:'Baloo 2',cursive; font-size:1.05rem; font-weight:800;
  cursor:pointer; box-shadow:4px 4px 0 var(--dark); transition:all 0.15s;
  color:var(--dark); text-align:center;
}
/* Hover effect for quiz options */
.quiz-opt:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--dark); }
/* Styles for correct answer option */
.quiz-opt.correct-ans { background:var(--green); color:#fff; border-color:#3a8a3a; box-shadow:4px 4px 0 #3a8a3a; transform:scale(1.05); }
/* Styles for wrong answer option */
.quiz-opt.wrong-ans   { background:var(--red); color:#fff; border-color:#a0001e; box-shadow:4px 4px 0 #a0001e; }
/* Quiz result message (Correct/Wrong) */
.quiz-result { font-size:1.4rem; font-weight:800; margin-top:16px; animation:popIn 0.3s cubic-bezier(.36,1.6,.64,1); min-height:2rem; }
/* Next button for quiz */
.quiz-next-btn {
  background:var(--yellow); border:3px solid var(--dark); border-radius:50px;
  padding:12px 36px; font-family:'Baloo 2',cursive; font-size:1.1rem; font-weight:800;
  cursor:pointer; box-shadow:4px 4px 0 var(--dark); transition:all 0.15s;
  margin-top:14px; display:none; /* Hidden by default */
}
/* Hover effect for quiz next button */
.quiz-next-btn:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--dark); }
/* Class to show quiz next button */
.quiz-next-btn.show { display:inline-block; }

/*QUIZ SPEAK KANNADA BUTTON*/
.quiz-speak-btn {
  display: block;
  margin: 15px auto;
  padding: 12px 20px;
  font-size: 16px;
  font-weight: bold;
  border-radius: 10px;
  border: none;
  background: #4D96FF;   /* same color as Next */
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

.quiz-speak-btn:hover {
  background: #3a7be0;
}
/*END SPEEAK BUTTON*/
/* Quiz finish screen styles */
.quiz-finish { text-align:center; padding:30px 20px; background:#fff; border:3px solid var(--dark); border-radius:24px; box-shadow:6px 6px 0 var(--dark); animation:popIn 0.4s cubic-bezier(.36,1.4,.64,1); }
/* Emoji for quiz finish screen */
.quiz-finish-emoji { font-size:4rem; display:block; margin-bottom:10px; }
/* Title for quiz finish screen */
.quiz-finish-title { font-size:1.8rem; font-weight:800; margin-bottom:8px; }
/* Score details for quiz finish screen */
.quiz-finish-score { font-size:1.1rem; color:#555; margin-bottom:20px; }
/* Restart/Next category button for quiz finish screen */
.quiz-restart-btn {
  background:var(--green); border:3px solid var(--dark); border-radius:50px;
  padding:12px 32px; font-family:'Baloo 2',cursive; font-size:1.05rem; font-weight:800;
  cursor:pointer; color:#fff; box-shadow:4px 4px 0 var(--dark);
  transition:all 0.15s;
}
/* Hover effect for quiz restart button */
.quiz-restart-btn:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--dark); }

/* Utility class to hide the words section if another mode is active */
#wordsSection.hide { display:none; }

// Function to switch between learning modes (Words, Sentences, Alphabet, Quiz)
function switchMode(mode) {
  currentMode = mode; // Update the global current mode variable

  // Update active state for mode tabs
  ["Words","Sentences","Alphabet","Quiz"].forEach(m => {
    const tab = document.getElementById("tab"+m);
    if(tab) tab.classList.toggle("active", mode === m.toLowerCase());
  });

  // Show/hide relevant sections based on the active mode
  document.getElementById("wordsSection").classList.toggle("hide", mode !== "words");
  document.getElementById("sentencesSection").classList.toggle("show", mode === "sentences");
  document.getElementById("alphabetSection").classList.toggle("show", mode === "alphabet");
  document.getElementById("quizSection").classList.toggle("show", mode === "quiz");

  // Call specific rendering functions when switching to certain modes
  if (mode === "alphabet") renderAlphabet(); // Render alphabet cards if switched to A-Z
  if (mode === "quiz") initQuiz(); // Initialize quiz if switched to Quiz mode
}

// =========================
// WORD SECTION FUNCTIONS
// =========================

let showAllCats = false; // Controls visibility of all word categories or limited ones
// Determines how many word categories are initially visible based on screen width
const visibleLimit = window.innerWidth < 600 ? 5 : 7; // Changed from 4 to 5 for mobile and 6 to 7 for desktop

// Renders the category buttons for the "Words" section
function renderCats() {
  const bar = document.getElementById("catBar");
  bar.innerHTML = ""; // Clear existing buttons

  const allCats = Object.keys(words); // Get all word category names
  // Decide which categories to show (all or limited)
  const catsToShow = showAllCats ? allCats : allCats.slice(0, visibleLimit);

  // Create a button for each category
  catsToShow.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (cat === currentCat ? " active" : ""); // Add 'active' class if it's the current category
    btn.dataset.cat = cat; // Store category name in data attribute
    btn.textContent = catEmoji(cat) + " " + cat; // Display emoji and category name

    // Set click event: update current category, re-render category buttons and word grid
    btn.onclick = () => {
      currentCat = cat;
      renderCats();
      renderGrid();
    };

    bar.appendChild(btn); // Add button to the category bar
  });

  // Add "More/Less" button if there are more categories than visibleLimit
  if (allCats.length > visibleLimit) {
    const toggleBtn = document.createElement("button");
    toggleBtn.className = "cat-btn"; // Standard button style
    toggleBtn.textContent = showAllCats ? "➖ Less" : "➕ More"; // Text changes based on state

    // Toggle showAllCats and re-render categories on click
    toggleBtn.onclick = () => {
      showAllCats = !showAllCats;
      renderCats();
    };

    bar.appendChild(toggleBtn);
  }
}

// Returns an emoji for a given word category
function catEmoji(cat) {
  // Map category names to specific emojis
  return {
    Animals:"🐾",Fruits:"🍓",Vegetables:"🥦",Colors:"🎨",
    Body:"🙋",Home:"🏠",Food:"🍽️",Birds:"🐦",Flowers:"🌸",
    Festivals:"🎉",Numbers:"🔢",Transport:"🚗",Games:"🏏"
  }[cat] || "📌"; // Default emoji if category not found
}

// Renders the word cards in the grid for the currently selected category
function renderGrid() {
  const grid = document.getElementById("grid");
  grid.innerHTML = ""; // Clear existing cards

  // Iterate over words in the current category
  words[currentCat].forEach((w, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.animationDelay = (i * 0.06) + "s"; // Staggered pop-in animation

    const badge = document.createElement("div");
    badge.className = "card-badge";
    badge.style.background = catColors[currentCat]; // Use category-specific color for badge
    badge.textContent = currentCat[0]; // Display first letter of category in badge
    card.appendChild(badge);

    // If it's a "Colors" word, display a color swatch, otherwise just the emoji
    if (w.color) {
      const sw = document.createElement("div");
      sw.className = "swatch"; sw.style.background = w.color; sw.textContent = w.emoji;
      card.appendChild(sw);
    } else {
      const em = document.createElement("span");
      em.className = "card-emoji"; em.textContent = w.emoji;
      card.appendChild(em);
    }

    // Add English and Kannada text to the card
    const en = document.createElement("div"); en.className = "card-en"; en.textContent = w.en; card.appendChild(en);
    const kn = document.createElement("div"); kn.className = "card-kn"; kn.textContent = w.kn; card.appendChild(kn);

    // Set click event for the card: open modal
    card.onclick = () => openModal(w, card);
    grid.appendChild(card); // Add card to the grid
  });
}

// Opens the modal popup to display detailed word information
function openModal(w, card) {
  // Populate modal content with word data
  document.getElementById("mEmoji").textContent = w.emoji;
  document.getElementById("mEn").textContent = w.en;
  document.getElementById("mKn").textContent = w.kn;
  document.getElementById("mPronun").textContent = "🔤 ಉಚ್ಚಾರಣೆ: " + w.pronun;
  document.getElementById("modalOverlay").classList.add("show"); // Show the modal

  speakText(w.en); // Have the browser speak the English word

  // Check if this card interaction is new, if so, add a star
  const key = w.en + currentCat; // Unique identifier for the word-category pair
  if (!seen.has(key)) {
    seen.add(key); // Mark as seen
    stars++; // Increment star count
    document.getElementById("starCount").textContent = stars; // Update star display
    addStar(); // Show a visual star animation
  }
  // Trigger bounce animation on the clicked card
  card.classList.remove("bounce"); void card.offsetWidth; card.classList.add("bounce");
}

// Function to handle modal closing
document.getElementById("closeBtn").onclick = () => document.getElementById("modalOverlay").classList.remove("show");
// Close modal if clicking outside the modal content
document.getElementById("modalOverlay").onclick = (e) => {
  if (e.target === document.getElementById("modalOverlay")) document.getElementById("modalOverlay").classList.remove("show");
};

  }[cat] || "💬"; // Default emoji if category not found

// Renders the sentence cards in the list for the currently selected category
function renderSentences() {
  const list = document.getElementById("sentList");
  list.innerHTML = ""; // Clear existing cards

  // Iterate over sentences in the current category
  sentences[currentSCat].forEach((s, i) => {
    const card = document.createElement("div");
    card.className = "sent-card";
    card.style.animationDelay = (i * 0.07) + "s"; // Staggered pop-in animation

    // Add emoji to the card
    const emo = document.createElement("div"); emo.className = "sent-emoji"; emo.textContent = s.emoji; card.appendChild(emo);
    // Container for English, Kannada, and pronunciation text
    const txt = document.createElement("div"); txt.className = "sent-text";
    const en = document.createElement("div"); en.className = "sent-en"; en.textContent = s.en; txt.appendChild(en);
    const kn = document.createElement("div"); kn.className = "sent-kn"; kn.textContent = s.kn; txt.appendChild(kn);
    const pr = document.createElement("div"); pr.className = "sent-pronun"; pr.textContent = "📢 " + s.pronun; txt.appendChild(pr);
    card.appendChild(txt);

    // "Say!" button for each sentence card
    const sayBtn = document.createElement("button");
    sayBtn.className = "sent-say"; sayBtn.textContent = "🔊 Say!";
    sayBtn.onclick = (e) => { e.stopPropagation(); speakText(s.en); }; // Stop propagation to prevent card click, then speak
    card.appendChild(sayBtn);

    // Set click event for the sentence card
    card.onclick = () => {
      const key = "sent_" + s.en; // Unique identifier for the sentence
      if (!seen.has(key)) {
        seen.add(key); // Mark as seen
        stars++; // Increment star count
        document.getElementById("starCount").textContent = stars; // Update star display
        addStar(); // Show a visual star animation
      }
      // Trigger bounce animation on the clicked card
      card.classList.remove("bounce"); void card.offsetWidth; card.classList.add("bounce");
      speakText(s.en); // Speak the English sentence
    };
    list.appendChild(card); // Add card to the sentence list
  });
}

// ALPHABET SECTION FUNCTIONS
// =========================

// Renders the alphabet cards (A-Z)
function renderAlphabet() {
  const grid = document.getElementById("alphabetGrid");
  grid.innerHTML = ""; // Clear existing cards

  // Iterate over letters in the alphabet array
  alphabet.forEach((a, i) => {
    const card = document.createElement("div");
    card.className = "alpha-card";
    card.style.animationDelay = (i * 0.04) + "s"; // Staggered pop-in animation
    card.style.borderColor = alphaColors[i % alphaColors.length]; // Apply border color from alphaColors
    card.style.boxShadow = `5px 5px 0 ${alphaColors[i % alphaColors.length]}`; // Apply shadow color

    // Populate card content using template literals
    card.innerHTML = `
      <span class="alpha-letter" style="background:linear-gradient(135deg,${alphaColors[i % alphaColors.length]},${alphaColors[(i+3) % alphaColors.length]});-webkit-background-clip:text;-webkit-text-fill-color:transparent;">${a.letter}</span>
      <span class="alpha-emoji">${a.emoji}</span>
      <div class="alpha-word">${a.word}</div>
      <div class="alpha-kn">${a.kn}</div>`;

    // Set click event for the alphabet card
    card.onclick = () => {
      speakText(a.letter + " for " + a.word); // Speak the letter and word
      // Trigger bounce animation on the clicked card
      card.classList.remove("bounce"); void card.offsetWidth; card.classList.add("bounce");
      const key = "alpha_" + a.letter; // Unique identifier for the letter
      if (!seen.has(key)) {
        seen.add(key); // Mark as seen
        stars++; // Increment star count
        document.getElementById("starCount").textContent = stars; // Update star display
        addStar(); // Show a visual star animation
      }
    };
    grid.appendChild(card); // Add card to the alphabet grid
  });
}


// =========================
// QUIZ SECTION FUNCTIONS
// =========================
// Function to speak any text using browser TTS
function speakText(text, lang = 'en-US') {
  if (!('speechSynthesis' in window)) {
    console.warn("Speech Synthesis not supported in this browser");
    return;
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);

  // Set language dynamically
  utterance.lang = lang;

  // Speed tuning
  utterance.rate = lang === 'kn-IN' ? 0.9 : 1.05;
  utterance.pitch = 1;

  setTimeout(() => window.speechSynthesis.speak(utterance), 50);
}

// Quiz state variables
let quizCat = "Animals"; // Current category
let quizWords = []; // Words in current quiz
let quizIndex = 0; // Current question index
let quizCorrect = 0; // Correct answers count
let quizWrong = 0; // Wrong answers count
let quizAnswered = false; // Has current question been answered?
const QUIZ_TOTAL = 10; // Total questions per quiz

let showAllQuizCats = false; // Show all categories toggle
const quizVisibleLimit = window.innerWidth < 600 ? 2 : 4; // Initial visible categories

// Load progress from localStorage or initialize empty
let quizProgress = JSON.parse(localStorage.getItem("quizProgress") || "{}");

// ====== Initialize quiz ======
function initQuiz() {
  quizCorrect = 0;
  quizWrong = 0;
  quizIndex = 0;
  quizAnswered = false;
  renderQuizUI();
}

// ====== Go to next category ======
function goToNextCategory() {
  const allCats = Object.keys(words);
  const currentIndex = allCats.indexOf(quizCat);
  const nextIndex = (currentIndex + 1) % allCats.length;
  quizCat = allCats[nextIndex];
  initQuiz();
}

// ====== Render the quiz interface ======
function renderQuizUI() {
  const box = document.getElementById("quizBox");
  if (!box) return;

  // Pick random words for the quiz
  quizWords = shuffle([...words[quizCat]]).slice(0, QUIZ_TOTAL);

  // Build quiz UI
  box.innerHTML = `
    <div style="text-align:center; margin-bottom:10px;">
      <div class="quiz-score-row">
        <div class="quiz-score-pill correct">⭐ <span id="qStars">0</span></div>
        <div class="quiz-score-pill correct">✅ <span id="qCorrect">0</span></div>
        <div class="quiz-score-pill wrong">❌ <span id="qWrong">0</span></div>
        <div class="quiz-score-pill total">📝 <span id="qIndex">1</span>/${QUIZ_TOTAL}</div>
      </div>
      <div class="quiz-cat-select" id="quizCatSelect"></div>
    </div>
    <div id="quizCardArea"></div>
  `;

  // ===== Category buttons =====
  const catSelect = document.getElementById("quizCatSelect");
  catSelect.innerHTML = "";
  const allCats = Object.keys(words);
  const catsToShow = showAllQuizCats ? allCats : allCats.slice(0, quizVisibleLimit);

  catsToShow.forEach((cat, index) => {
    const isLocked = index > 0 && !quizProgress[allCats[index - 1]];
    const btn = document.createElement("button");
    btn.className = "quiz-cat-btn" +
                    (cat === quizCat ? " active" : "") +
                    (isLocked ? " locked" : "");
    const stars = quizProgress[cat] ? "⭐" : "";
    btn.textContent = (isLocked ? "🔒 " : "") + cat + " " + stars;
    btn.onclick = () => {
      if (isLocked) return;
      quizCat = cat;
      initQuiz();
    };
    catSelect.appendChild(btn);
  });

  // More/Less toggle
  if (allCats.length > quizVisibleLimit) {
    const toggleBtn = document.createElement("button");
    toggleBtn.className = "quiz-cat-btn";
    toggleBtn.textContent = showAllQuizCats ? "➖ Less" : "➕ More";
    toggleBtn.onclick = () => {
      showAllQuizCats = !showAllQuizCats;
      renderQuizUI();
    };
    catSelect.appendChild(toggleBtn);
  }

  renderQuestion();
}

// ====== Shuffle array ======
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ====== Update quiz score ======
function updateQuizScore() {
  const c = document.getElementById("qCorrect");
  const w = document.getElementById("qWrong");
  const i = document.getElementById("qIndex");
  const s = document.getElementById("qStars");
  if (c) c.textContent = quizCorrect;
  if (w) w.textContent = quizWrong;
  if (i) i.textContent = Math.min(quizIndex + 1, QUIZ_TOTAL);
  if (s) s.textContent = quizProgress[quizCat] ? "⭐" : "0";
}

// ====== START ----------------------Check answer ========================================
// ====== Check answer ======
function checkAnswer(selected, correct, btn, knWord) {
  if (quizAnswered) return;
  quizAnswered = true;

  document.querySelectorAll(".quiz-opt").forEach(b => {
    b.disabled = true;
    b.style.cursor = "default";
    if (b.textContent === correct) b.classList.add("correct-ans");
    else if (b === btn && selected !== correct) b.classList.add("wrong-ans");
  });

  const result = document.getElementById("quizResult");
  const nextBtn = document.getElementById("quizNextBtn");

  // Capitalize first letter for better speech
  const niceWord = correct.charAt(0).toUpperCase() + correct.slice(1);

  let speechText = "";

  if (selected === correct) {
    quizCorrect++;
    result.textContent = "✅ Correct!";
    result.style.color = "#6BCB77";

    speechText = `${niceWord} is the correct answer`;
  } else {
    quizWrong++;
    result.textContent = `❌ Wrong! It is ${niceWord}!`;
    result.style.color = "#FF4D6D";

    speechText = `Wrong! The correct answer is ${niceWord}`;
  }

  speakText(speechText, 'en-US');

  updateQuizScore();

  if (nextBtn) {
    nextBtn.disabled = false;
    nextBtn.style.display = "inline-block";
    nextBtn.focus();
  }
}

//close check answer //////////////////////////////////////////////////////////////CLOSE CHECK ANSWER/////////////

// ====== Next question ======
function nextQuestion() {
  if (!quizAnswered) return;
  quizIndex++;
  renderQuestion();
  updateQuizScore();
}

// ====== Render question ======
function renderQuestion() {
  const area = document.getElementById("quizCardArea");
  if (!area) return;

  // ===== Quiz finished =====
  if (quizIndex >= QUIZ_TOTAL || quizIndex >= quizWords.length) {
    const pct = Math.round((quizCorrect / QUIZ_TOTAL) * 100);
    if (pct >= 90) {
      quizProgress[quizCat] = true;
      localStorage.setItem("quizProgress", JSON.stringify(quizProgress));
    }

    const trophy =
      pct >= 90 ? "🏆" :
      pct >= 70 ? "🥇" :
      pct >= 50 ? "🥈" : "🎯";

    const msg =
      pct >= 90 ? "Excellent! ಭಲೇ!" :
      pct >= 70 ? "Well done! ಚೆನ್ನಾಗಿದೆ!" :
      pct >= 50 ? "Good try! ಮತ್ತೆ ಪ್ರಯತ್ನಿಸು!" :
                  "Keep learning! ಕಲಿಯುತ್ತಿರು!";

    area.innerHTML = `
      <div class="quiz-finish">
        <span class="quiz-finish-emoji">${trophy}</span>
        <div class="quiz-finish-title">${msg}</div>
        <div class="quiz-finish-score">
          ✅ ${quizCorrect} / ${QUIZ_TOTAL} (${pct}%)
        </div>
        ${
          pct >= 90
            ? `<button class="quiz-restart-btn" onclick="goToNextCategory()">➡ Next Category</button>`
            : `<button class="quiz-restart-btn" onclick="initQuiz()">🔄 Try Again</button>`
        }
      </div>
    `;
    return;
  }

  // ===== Current word =====
  const w = quizWords[quizIndex];
  quizAnswered = false;

  // ===== Wrong options =====
  const wrongOptions = shuffle(words[quizCat].filter(x => x.en !== w.en)).slice(0, 3);
  while (wrongOptions.length < 3) wrongOptions.push(w);

  const options = shuffle([w, ...wrongOptions]);

  // ===== Quiz card HTML =====
  area.innerHTML = `
    <div class="quiz-card">
      <div class="quiz-question-label">What is this in English?</div>
      <span class="quiz-emoji">${w.emoji}</span>
      <div class="quiz-kn">${w.kn}</div>
      <div class="quiz-hint">ಇದು ಇಂಗ್ಲಿಷ್‌ನಲ್ಲಿ ಏನು?</div>
      <div class="quiz-options" id="quizOptions"></div>
      <div class="quiz-result" id="quizResult" role="alert"></div>
      <button class="quiz-speak-btn" id="quizSpeakBtn">🔊 Speak Kannada</button>
      <button class="quiz-next-btn" id="quizNextBtn" onclick="nextQuestion()" disabled style="display:none; margin:15px auto;">
        Next ▶
      </button>
    </div>
  `;

  // ===== Option buttons =====
  const optContainer = document.getElementById("quizOptions");
  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "quiz-opt";
    btn.textContent = opt.en;
    btn.setAttribute("aria-label", `Option: ${opt.en}`);
    btn.onclick = () => checkAnswer(opt.en, w.en, btn, w.kn);
    optContainer.appendChild(btn);
  });

  // ===== Speak Kannada button =====
	const speakBtn = document.getElementById("quizSpeakBtn");
	speakBtn.onclick = () => speakText(w.kn, 'kn-IN');

  updateQuizScore();// Update quiz score display
}

// STAR ANIMATION
// =========================
// Adds and animates a star when a card is learned/clicked for the first time
function addStar() {
  const bar = document.getElementById("scoreBar");
  const s = document.createElement("span"); s.className = "star"; s.textContent = "⭐"; bar.appendChild(s);
  setTimeout(() => s.remove(), 1000); // Remove the star after 1 second
}

// IIFE (Immediately Invoked Function Expression) for sparkle particles in header
(function() {
  const header = document.getElementById("mainHeader");
  if (!header) return; // Exit if header element is not found
  const colors = ["#FF6B35","#FFD93D","#FF85A1","#C77DFF","#4D96FF","#6BCB77","#2EC4B6"]; // Colors for circle sparkles
  const shapes = ["⭐","✨","💫","🌟","⚡","🎈","🎀"]; // Emojis for shape sparkles
  function createSpark() {
    const el = document.createElement("div");
    el.className = "spark"; // Assign spark class for animation
    const size = Math.random()*16+8; // Random size for the sparkle
    if (Math.random() > 0.5) { // Randomly choose between emoji or colored circle sparkle
      el.textContent = shapes[Math.floor(Math.random()*shapes.length)]; // Set emoji text
      el.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;position:absolute;pointer-events:none;font-size:${size}px;animation:sparkFloat ${Math.random()*2+1.5}s linear infinite;animation-delay:${Math.random()*3}s;opacity:0;`;
    } else {
      el.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${Math.random()*2+1.5}s;animation-delay:${Math.random()*3}s;opacity:0;`;
    }
    header.appendChild(el); // Add sparkle to the header
    setTimeout(() => el.remove(), 5000); // Remove sparkle after 5 seconds
  }
  setInterval(createSpark, 300); // Create a new sparkle every 300ms
  for(let i=0;i<8;i++) setTimeout(createSpark, i*150); // Create initial batch of sparkles
})();
</script>
