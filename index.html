<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koppal - Kids - Learn English with Kannada 🌟</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Noto+Sans+Kannada:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #FFF8E7;
    --yellow: #FFD93D;
    --orange: #FF6B35;
    --pink: #FF85A1;
    --green: #6BCB77;
    --blue: #4D96FF;
    --purple: #C77DFF;
    --red: #FF4D6D;
    --teal: #2EC4B6;
    --white: #ffffff;
    --dark: #2B2D42;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Baloo 2', cursive;
    background: var(--sky);
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      radial-gradient(circle at 10% 10%, #FFD93D44 80px, transparent 80px),
      radial-gradient(circle at 90% 15%, #FF85A144 60px, transparent 60px),
      radial-gradient(circle at 80% 85%, #6BCB7744 70px, transparent 70px),
      radial-gradient(circle at 20% 80%, #4D96FF44 55px, transparent 55px);
  }
  header { text-align: center; padding: 28px 20px 8px; }
  header h1 {
    font-size: clamp(1.8rem, 5vw, 3rem);
    font-weight: 800; color: var(--orange);
    text-shadow: 3px 3px 0 #fff, 5px 5px 0 #FFD93D;
    letter-spacing: 1px;
  }
  header p { font-size: 1.05rem; color: var(--dark); margin-top: 5px; font-weight: 600; }

  .mode-tabs { display: flex; justify-content: center; gap: 12px; padding: 16px 16px 6px; }
  .mode-tab {
    background: var(--white); border: 3px solid var(--dark); border-radius: 50px;
    padding: 10px 28px; font-family: 'Baloo 2', cursive; font-size: 1.05rem; font-weight: 800;
    cursor: pointer; box-shadow: 4px 4px 0 var(--dark); transition: all 0.15s; color: var(--dark);
  }
  .mode-tab:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--dark); }
  .mode-tab.active { background: var(--dark); color: #fff; transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--orange); }

  .score-bar { text-align: center; padding: 6px; font-size: 1.1rem; font-weight: 700; color: var(--dark); }
  .star { font-size: 1.3rem; animation: spin 0.5s ease; display: inline-block; }
  @keyframes spin { from { transform: rotate(0deg) scale(0); } to { transform: rotate(360deg) scale(1); } }

  .category-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 14px 16px 8px; }
  .cat-btn {
    background: var(--white); border: 3px solid var(--dark); border-radius: 50px;
    padding: 7px 18px; font-family: 'Baloo 2', cursive; font-size: 0.95rem; font-weight: 700;
    cursor: pointer; transition: all 0.2s; box-shadow: 3px 3px 0 var(--dark); color: var(--dark);
  }
  .cat-btn:hover, .cat-btn.active { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--dark); }
  .cat-btn.active { color: #fff; }
  .cat-btn[data-cat="Animals"].active    { background: var(--green); }
  .cat-btn[data-cat="Fruits"].active     { background: var(--orange); }
  .cat-btn[data-cat="Vegetables"].active { background: var(--teal); }
  .cat-btn[data-cat="Colors"].active     { background: var(--purple); }
  .cat-btn[data-cat="Body"].active       { background: var(--pink); }
  .cat-btn[data-cat="Home"].active       { background: var(--blue); }
  .cat-btn[data-cat="Food"].active       { background: var(--red); }
  .cat-btn[data-cat="Birds"].active      { background: #00B4D8; }
  .cat-btn[data-cat="Flowers"].active    { background: #E040FB; }
  .cat-btn[data-cat="Festivals"].active  { background: #FF9800; }
  .cat-btn[data-cat="Numbers"].active    { background: #F72585; }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
    gap: 16px; padding: 16px 18px 36px; max-width: 920px; margin: 0 auto;
  }
  .card {
    background: var(--white); border: 3px solid var(--dark); border-radius: 20px;
    padding: 16px 10px 13px; text-align: center; cursor: pointer;
    box-shadow: 5px 5px 0 var(--dark); transition: transform 0.15s, box-shadow 0.15s;
    position: relative; overflow: hidden;
    animation: popIn 0.4s cubic-bezier(.36,1.4,.64,1) both;
  }
  .card:hover { transform: translate(-3px,-3px); box-shadow: 8px 8px 0 var(--dark); }
  .card:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--dark); }
  .card.bounce { animation: bounce 0.4s cubic-bezier(.36,1.6,.64,1); }
  @keyframes popIn { from { opacity:0; transform:scale(0.6) translateY(20px);} to { opacity:1; transform:scale(1) translateY(0);} }
  @keyframes bounce { 0%{transform:scale(1);} 40%{transform:scale(1.18) translate(-3px,-3px);} 70%{transform:scale(0.95);} 100%{transform:scale(1);} }
  .card-emoji { font-size: 2.8rem; display: block; margin-bottom: 7px; line-height: 1; }
  .card-en { font-size: 1.05rem; font-weight: 800; color: var(--dark); margin-bottom: 3px; }
  .card-kn { font-family: 'Noto Sans Kannada', sans-serif; font-size: 0.95rem; font-weight: 700; color: var(--orange); }
  .card-badge { position: absolute; top: 7px; right: 8px; font-size: 0.65rem; font-weight: 800; padding: 2px 7px; border-radius: 20px; border: 2px solid var(--dark); color: #fff; }
  .swatch { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--dark); margin: 0 auto 7px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }

  #sentencesSection { display: none; max-width: 860px; margin: 0 auto; padding: 10px 18px 40px; }
  #sentencesSection.show { display: block; }

  .sent-cat-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 10px 0 16px; }
  .sent-cat-btn {
    background: var(--white); border: 3px solid var(--dark); border-radius: 50px;
    padding: 7px 16px; font-family: 'Baloo 2', cursive; font-size: 0.9rem; font-weight: 700;
    cursor: pointer; box-shadow: 3px 3px 0 var(--dark); transition: all 0.2s; color: var(--dark);
  }
  .sent-cat-btn:hover, .sent-cat-btn.active { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--dark); }
  .sent-cat-btn.active { color: #fff; }
  .sent-cat-btn[data-scat="Animals & Nature"].active   { background: var(--green); }
  .sent-cat-btn[data-scat="Family & People"].active    { background: var(--pink); }
  .sent-cat-btn[data-scat="Food & Eating"].active      { background: var(--orange); }
  .sent-cat-btn[data-scat="School & Playing"].active   { background: var(--blue); }
  .sent-cat-btn[data-scat="Vegetables & Fruits"].active{ background: var(--teal); }
  .sent-cat-btn[data-scat="Birds & Flowers"].active   { background: #E040FB; }
  .sent-cat-btn[data-scat="Festivals 🎉"].active      { background: #FF9800; }
  .sent-cat-btn[data-scat="Numbers 🔢"].active        { background: #F72585; }

  .sent-list { display: flex; flex-direction: column; gap: 14px; }
  .sent-card {
    background: var(--white); border: 3px solid var(--dark); border-radius: 18px;
    padding: 14px 18px; box-shadow: 5px 5px 0 var(--dark);
    cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
    animation: popIn 0.35s cubic-bezier(.36,1.4,.64,1) both;
    display: flex; align-items: center; gap: 14px;
  }
  .sent-card:hover { transform: translate(-3px,-3px); box-shadow: 8px 8px 0 var(--dark); }
  .sent-card:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--dark); }
  .sent-card.bounce { animation: bounce 0.4s cubic-bezier(.36,1.6,.64,1); }
  .sent-emoji { font-size: 2.2rem; flex-shrink: 0; }
  .sent-text { flex: 1; }
  .sent-en { font-size: 1.1rem; font-weight: 800; color: var(--dark); margin-bottom: 4px; }
  .sent-kn { font-family: 'Noto Sans Kannada', sans-serif; font-size: 0.98rem; font-weight: 700; color: var(--orange); margin-bottom: 3px; }
  .sent-pronun { font-size: 0.82rem; color: #999; font-style: italic; }
  .sent-say { background: var(--yellow); border: 2px solid var(--dark); border-radius: 30px; padding: 6px 14px; font-family: 'Baloo 2', cursive; font-size: 0.88rem; font-weight: 700; cursor: pointer; box-shadow: 2px 2px 0 var(--dark); flex-shrink: 0; transition: all 0.15s; }
  .sent-say:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--dark); }

  .modal-overlay { display: none; position: fixed; inset: 0; background: #0007; z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: #fff; border: 4px solid var(--dark); border-radius: 28px; padding: 30px 26px; text-align: center; max-width: 340px; width: 90%; box-shadow: 8px 8px 0 var(--dark); animation: popIn 0.3s cubic-bezier(.36,1.4,.64,1); }
  .modal-emoji { font-size: 4.5rem; display: block; margin-bottom: 10px; }
  .modal-en { font-size: 1.9rem; font-weight: 800; color: var(--dark); }
  .modal-kn { font-family: 'Noto Sans Kannada', sans-serif; font-size: 1.5rem; font-weight: 700; color: var(--orange); margin: 5px 0 3px; }
  .modal-pronun { font-size: 0.95rem; color: #777; margin-bottom: 18px; }
  .say-btn { background: var(--yellow); border: 3px solid var(--dark); border-radius: 50px; padding: 9px 24px; font-family: 'Baloo 2', cursive; font-size: 1rem; font-weight: 800; cursor: pointer; box-shadow: 4px 4px 0 var(--dark); transition: all 0.15s; margin-right: 8px; }
  .say-btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--dark); }
  .close-btn { background: var(--pink); border: 3px solid var(--dark); border-radius: 50px; padding: 9px 24px; font-family: 'Baloo 2', cursive; font-size: 1rem; font-weight: 800; cursor: pointer; color: #fff; box-shadow: 4px 4px 0 var(--dark); transition: all 0.15s; }
  .close-btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--dark); }

  footer { text-align: center; padding: 12px; font-size: 0.88rem; color: #bbb; font-weight: 600; }
  #wordsSection.hide { display: none; }
</style>
</head>
<body>

<header>
  <h1>🌟 Koppal Kids! 🌟</h1>
  <p>Learn English with Kannada &nbsp;· &nbsp;ಇಂಗ್ಲಿಷ್ ಕಲಿಯೋಣ! &nbsp;Click on any card!</p>
</header>

<div class="mode-tabs">

  <button class="mode-tab" id="tabSentences" onclick="switchMode('sentences')">💬 Sentences</button>
</div>

<div class="score-bar" id="scoreBar">⭐ Stars collected: <span id="starCount">0</span></div>

<div id="wordsSection">
  <div class="category-bar" id="catBar"></div>
  <div class="grid" id="grid"></div>
</div>

<div id="sentencesSection">
  <div class="sent-cat-bar" id="sentCatBar"></div>
  <div class="sent-list" id="sentList"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <span class="modal-emoji" id="mEmoji"></span>
    <div class="modal-en" id="mEn"></div>
    <div class="modal-kn" id="mKn"></div>
    <div class="modal-pronun" id="mPronun"></div>
    <button class="close-btn" id="closeBtn">✓ OK!</button>
  </div>
</div>

<footer>

let currentMode = "words";
let currentCat = "Animals";
let currentSCat = "Animals & Nature";
let stars = 0;
let seen = new Set();

function switchMode(mode) {
  currentMode = mode;
  document.getElementById("tabWords").classList.toggle("active", mode === "words");
  document.getElementById("tabSentences").classList.toggle("active", mode === "sentences");
  document.getElementById("wordsSection").classList.toggle("hide", mode !== "words");
  document.getElementById("sentencesSection").classList.toggle("show", mode === "sentences");
}

function renderCats() {
  const bar = document.getElementById("catBar");
  bar.innerHTML = "";
  Object.keys(words).forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (cat === currentCat ? " active" : "");
    btn.dataset.cat = cat;
    btn.textContent = catEmoji(cat) + " " + cat;
    btn.onclick = () => { currentCat = cat; renderCats(); renderGrid(); };
    bar.appendChild(btn);
  });
}
function catEmoji(cat) {
  return {Animals:"🐾",Fruits:"🍓",Vegetables:"🥦",Colors:"🎨",Body:"🙋",Home:"🏠",Food:"🍽️",Birds:"🐦",Flowers:"🌸",Festivals:"🎉",Numbers:"🔢"}[cat] || "📌";
}
function renderGrid() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  words[currentCat].forEach((w, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.animationDelay = (i * 0.06) + "s";
    const badge = document.createElement("div");
    badge.className = "card-badge";
    badge.style.background = catColors[currentCat];
    badge.textContent = currentCat[0];
    card.appendChild(badge);
    if (w.color) {
      const sw = document.createElement("div");
      sw.className = "swatch"; sw.style.background = w.color; sw.textContent = w.emoji;
      card.appendChild(sw);
    } else {
      const em = document.createElement("span");
      em.className = "card-emoji"; em.textContent = w.emoji;
      card.appendChild(em);
    }
    const en = document.createElement("div"); en.className = "card-en"; en.textContent = w.en; card.appendChild(en);
    const kn = document.createElement("div"); kn.className = "card-kn"; kn.textContent = w.kn; card.appendChild(kn);
    card.onclick = () => openModal(w, card);
    grid.appendChild(card);
  });
}
function openModal(w, card) {
  document.getElementById("mEmoji").textContent = w.emoji;
  document.getElementById("mEn").textContent = w.en;
  document.getElementById("mKn").textContent = w.kn;
  document.getElementById("mPronun").textContent = "🔤 ಉಚ್ಚಾರಣೆ: " + w.pronun;
  document.getElementById("modalOverlay").classList.add("show");
  speakText(w.en);
  const key = w.en + currentCat;
  if (!seen.has(key)) { seen.add(key); stars++; document.getElementById("starCount").textContent = stars; addStar(); }
  card.classList.remove("bounce"); void card.offsetWidth; card.classList.add("bounce");
}

function renderSentCats() {
  const bar = document.getElementById("sentCatBar");
  bar.innerHTML = "";
  Object.keys(sentences).forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "sent-cat-btn" + (cat === currentSCat ? " active" : "");
    btn.dataset.scat = cat;
    btn.textContent = sentCatEmoji(cat) + " " + cat;
    btn.onclick = () => { currentSCat = cat; renderSentCats(); renderSentences(); };
    bar.appendChild(btn);
  });
}
function sentCatEmoji(cat) {
  return {"Animals & Nature":"🐾","Family & People":"👨‍👩‍👧","Food & Eating":"🍽️","School & Playing":"🏫","Vegetables & Fruits":"🥦","Birds & Flowers":"🌸","Festivals 🎉":"🎊","Numbers 🔢":"🔢"}[cat] || "💬";
}
function renderSentences() {
  const list = document.getElementById("sentList");
  list.innerHTML = "";
  sentences[currentSCat].forEach((s, i) => {
    const card = document.createElement("div");
    card.className = "sent-card";
    card.style.animationDelay = (i * 0.07) + "s";
    const emo = document.createElement("div"); emo.className = "sent-emoji"; emo.textContent = s.emoji; card.appendChild(emo);
    const txt = document.createElement("div"); txt.className = "sent-text";
    const en = document.createElement("div"); en.className = "sent-en"; en.textContent = s.en; txt.appendChild(en);
    const kn = document.createElement("div"); kn.className = "sent-kn"; kn.textContent = s.kn; txt.appendChild(kn);
    const pr = document.createElement("div"); pr.className = "sent-pronun"; pr.textContent = "📢 " + s.pronun; txt.appendChild(pr);
    card.appendChild(txt);
    const sayBtn = document.createElement("button");
    sayBtn.className = "sent-say"; sayBtn.textContent = "🔊 Say!";
    sayBtn.onclick = (e) => { e.stopPropagation(); speakText(s.en); };
    card.appendChild(sayBtn);
    card.onclick = () => {
      const key = "sent_" + s.en;
      if (!seen.has(key)) { seen.add(key); stars++; document.getElementById("starCount").textContent = stars; addStar(); }
      card.classList.remove("bounce"); void card.offsetWidth; card.classList.add("bounce");
      speakText(s.en);
    };
    list.appendChild(card);
  });
}

function speakText(text) {
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.8; u.pitch = 1.2; u.lang = "en-US";
    speechSynthesis.speak(u);
  }
}
function addStar() {
  const bar = document.getElementById("scoreBar");
  const s = document.createElement("span"); s.className = "star"; s.textContent = "⭐"; bar.appendChild(s);
  setTimeout(() => s.remove(), 1000);
}

document.getElementById("closeBtn").onclick = () => document.getElementById("modalOverlay").classList.remove("show");
document.getElementById("modalOverlay").onclick = (e) => {
  if (e.target === document.getElementById("modalOverlay")) document.getElementById("modalOverlay").classList.remove("show");
};

renderCats(); renderGrid();
renderSentCats(); renderSentences();
</script>
