<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koppal - Kids | Learn English with Kannada 🌟</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Noto+Sans+Kannada:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ========================= */
/* HEADER FLEX LAYOUT        */
/* ========================= */
#mainHeader { padding: 20px; }
.header-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.title-block { text-align: center; flex: 1; }
.title-block h1 { margin: 0; }
.hero-img {
  width: 100px; height: 100px; object-fit: cover; border-radius: 50%;
  border: 4px solid #fff; box-shadow: 0 6px 14px rgba(0,0,0,0.2);
  animation: float 5s ease-in-out infinite; flex-shrink: 0;
}
@keyframes float { 0%{transform:translateY(0);} 50%{transform:translateY(-10px);} 100%{transform:translateY(0);} }
@media (max-width: 768px) {
  .header-row { flex-direction: row; align-items: center; justify-content: space-between; gap: 6px; }
  .hero-img { width:14vw; height:14vw; min-width:45px; min-height:45px; max-width:70px; max-height:70px; flex-shrink:0; }
  .title-block { flex:1; text-align:center; padding:0 5px; }
  .title-block h1 { font-size:5vw; margin:0; line-height:1.2; }
  .title-block p { font-size:3.2vw; line-height:1.3; }
}
:root {
  --sky:#FFF8E7; --yellow:#FFD93D; --orange:#FF6B35; --pink:#FF85A1;
  --green:#6BCB77; --blue:#4D96FF; --purple:#C77DFF; --red:#FF4D6D;
  --teal:#2EC4B6; --white:#ffffff; --dark:#2B2D42;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Baloo 2',cursive; background:var(--sky); min-height:100vh; overflow-x:hidden;
  background-image:
    radial-gradient(circle at 10% 10%,#FFD93D44 80px,transparent 80px),
    radial-gradient(circle at 90% 15%,#FF85A144 60px,transparent 60px),
    radial-gradient(circle at 80% 85%,#6BCB7744 70px,transparent 70px),
    radial-gradient(circle at 20% 80%,#4D96FF44 55px,transparent 55px);
}

/* ── HEADER ANIMATIONS ── */
header { text-align:center; padding:28px 20px 8px; position:relative; overflow:hidden; }
.spark { position:absolute; border-radius:50%; pointer-events:none; animation:sparkFloat linear infinite; }
@keyframes sparkFloat { 0%{transform:translateY(0) scale(1) rotate(0deg);opacity:0;} 20%{opacity:1;} 80%{opacity:1;} 100%{transform:translateY(-120px) scale(0.3) rotate(360deg);opacity:0;} }
.title-wrap { position:relative; display:inline-block; }
header h1 {
  font-size:clamp(2rem,6vw,3.4rem); font-weight:800; letter-spacing:2px;
  background:linear-gradient(135deg,#FF6B35 0%,#FFD93D 40%,#FF85A1 70%,#C77DFF 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  background-size:200% auto; animation:titleShine 3s linear infinite,titleBounce 2s ease-in-out infinite;
  filter:drop-shadow(0 4px 8px #FF6B3544); position:relative;
}
@keyframes titleShine { 0%{background-position:0% center;} 100%{background-position:200% center;} }
@keyframes titleBounce { 0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(-4px) scale(1.02);} }
.title-star { display:inline-block; animation:starSpin 2s ease-in-out infinite; font-size:clamp(1.4rem,4vw,2rem); }
.title-star:nth-child(1){animation-delay:0s;} .title-star:nth-child(3){animation-delay:0.5s;}
@keyframes starSpin { 0%,100%{transform:rotate(-15deg) scale(1);} 50%{transform:rotate(15deg) scale(1.3);} }
header p { font-size:1.05rem; color:var(--dark); margin-top:5px; font-weight:600; animation:fadeSlideUp 0.8s ease both; }
@keyframes fadeSlideUp { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }

/* ── FOOTER CREDIT ── */
.credit-name {
  display:inline-block; font-weight:800; font-size:1rem;
  background:linear-gradient(90deg,#FF6B35,#FFD93D,#FF85A1,#C77DFF,#4D96FF,#FF6B35);
  background-size:300% auto; -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text; animation:nameShine 2.5s linear infinite; position:relative;
}
@keyframes nameShine { 0%{background-position:0% center;} 100%{background-position:300% center;} }
.credit-name::after { content:' ✨'; animation:sparkle 1.5s ease-in-out infinite; -webkit-text-fill-color:initial; font-size:0.85rem; }
@keyframes sparkle { 0%,100%{opacity:1;transform:scale(1) rotate(0deg);} 50%{opacity:0.6;transform:scale(1.4) rotate(20deg);} }
footer { text-align:center; padding:20px 14px 14px; font-size:0.9rem; font-weight:600; color:#aaa; position:relative; }
.footer-hearts { display:inline-block; animation:heartBeat 1s ease-in-out infinite; }
@keyframes heartBeat { 0%,100%{transform:scale(1);} 50%{transform:scale(1.3);} }

/* ── TABS ── */
.mode-tabs { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; padding:16px 16px 6px; }
.mode-tab {
  background:var(--white); border:3px solid var(--dark); border-radius:50px;
  padding:9px 22px; font-family:'Baloo 2',cursive; font-size:1rem; font-weight:800;
  cursor:pointer; box-shadow:4px 4px 0 var(--dark); transition:all 0.15s; color:var(--dark);
}
.mode-tab:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--dark); }
.mode-tab.active { background:var(--dark); color:#fff; transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--orange); }

/* ── SCORE BAR ── */
.score-bar { text-align:center; padding:6px; font-size:1.1rem; font-weight:700; color:var(--dark); }
.star { font-size:1.3rem; animation:spin 0.5s ease; display:inline-block; }
@keyframes spin { from{transform:rotate(0deg) scale(0);} to{transform:rotate(360deg) scale(1);} }

/* ── CATEGORY BAR ── */
.category-bar { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; padding:14px 16px 8px; }
.cat-btn {
  background:var(--white); border:3px solid var(--dark); border-radius:50px;
  padding:7px 18px; font-family:'Baloo 2',cursive; font-size:0.95rem; font-weight:700;
  cursor:pointer; transition:all 0.2s; box-shadow:3px 3px 0 var(--dark); color:var(--dark);
}
.cat-btn:hover,.cat-btn.active { transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--dark); }
.cat-btn.active { color:#fff; }
.cat-btn[data-cat="Animals"].active  { background:var(--green); }
.cat-btn[data-cat="Fruits"].active   { background:var(--orange); }
.cat-btn[data-cat="Vegetables"].active{background:var(--teal); }
.cat-btn[data-cat="Colors"].active   { background:var(--purple); }
.cat-btn[data-cat="Body"].active     { background:var(--pink); }
.cat-btn[data-cat="Home"].active     { background:var(--blue); }
.cat-btn[data-cat="Food"].active     { background:var(--red); }
.cat-btn[data-cat="Birds"].active    { background:#00B4D8; }
.cat-btn[data-cat="Flowers"].active  { background:#E040FB; }
.cat-btn[data-cat="Festivals"].active{ background:#FF9800; }
.cat-btn[data-cat="Numbers"].active  { background:#F72585; }
.cat-btn[data-cat="Transport"].active{ background:#3D5A80; }
.cat-btn[data-cat="Games"].active    { background:#FFB703; }

/* ── WORD GRID ── */
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:16px; padding:16px 18px 36px; max-width:920px; margin:0 auto; }
.card { background:var(--white); border:3px solid var(--dark); border-radius:20px; padding:16px 10px 13px; text-align:center; cursor:pointer; box-shadow:5px 5px 0 var(--dark); transition:transform 0.15s,box-shadow 0.15s; position:relative; overflow:hidden; animation:popIn 0.4s cubic-bezier(.36,1.4,.64,1) both; }
.card:hover { transform:translate(-3px,-3px); box-shadow:8px 8px 0 var(--dark); }
.card:active { transform:translate(2px,2px); box-shadow:2px 2px 0 var(--dark); }
.card.bounce { animation:bounce 0.4s cubic-bezier(.36,1.6,.64,1); }
@keyframes popIn { from{opacity:0;transform:scale(0.6) translateY(20px);} to{opacity:1;transform:scale(1) translateY(0);} }
@keyframes bounce { 0%{transform:scale(1);} 40%{transform:scale(1.18) translate(-3px,-3px);} 70%{transform:scale(0.95);} 100%{transform:scale(1);} }
.card-emoji { font-size:2.8rem; display:block; margin-bottom:7px; line-height:1; }
.card-en { font-size:1.05rem; font-weight:800; color:var(--dark); margin-bottom:3px; }
.card-kn { font-family:'Noto Sans Kannada',sans-serif; font-size:0.95rem; font-weight:700; color:var(--orange); }
.card-badge { position:absolute; top:7px; right:8px; font-size:0.65rem; font-weight:800; padding:2px 7px; border-radius:20px; border:2px solid var(--dark); color:#fff; }
.swatch { width:46px; height:46px; border-radius:50%; border:3px solid var(--dark); margin:0 auto 7px; display:flex; align-items:center; justify-content:center; font-size:1.3rem; }

/* ── SENTENCES ── */
#sentencesSection { display:none; max-width:860px; margin:0 auto; padding:10px 18px 40px; }
#sentencesSection.show { display:block; }
.sent-cat-bar { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; padding:10px 0 16px; }
.sent-cat-btn { background:var(--white); border:3px solid var(--dark); border-radius:50px; padding:7px 16px; font-family:'Baloo 2',cursive; font-size:0.9rem; font-weight:700; cursor:pointer; box-shadow:3px 3px 0 var(--dark); transition:all 0.2s; color:var(--dark); }
.sent-cat-btn:hover,.sent-cat-btn.active { transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--dark); }
.sent-cat-btn.active { color:#fff; }
.sent-cat-btn[data-scat="Animals & Nature"].active { background:var(--green); }
.sent-cat-btn[data-scat="Family & People"].active  { background:var(--pink); }
.sent-cat-btn[data-scat="Food & Eating"].active    { background:var(--orange); }
.sent-cat-btn[data-scat="School & Playing"].active { background:var(--blue); }
.sent-cat-btn[data-scat="Vegetables & Fruits"].active{ background:var(--teal); }
.sent-cat-btn[data-scat="Birds & Flowers"].active  { background:#E040FB; }
.sent-cat-btn[data-scat="Festivals 🎉"].active     { background:#FF9800; }
.sent-cat-btn[data-scat="Numbers 🔢"].active       { background:#F72585; }
.sent-cat-btn[data-scat="Transport 🚗"].active     { background:#3D5A80; }
.sent-list { display:flex; flex-direction:column; gap:14px; }
.sent-card { background:var(--white); border:3px solid var(--dark); border-radius:18px; padding:14px 18px; box-shadow:5px 5px 0 var(--dark); cursor:pointer; transition:transform 0.15s,box-shadow 0.15s; animation:popIn 0.35s cubic-bezier(.36,1.4,.64,1) both; display:flex; align-items:center; gap:14px; }
.sent-card:hover { transform:translate(-3px,-3px); box-shadow:8px 8px 0 var(--dark); }
.sent-card:active { transform:translate(2px,2px); box-shadow:2px 2px 0 var(--dark); }
.sent-card.bounce { animation:bounce 0.4s cubic-bezier(.36,1.6,.64,1); }
.sent-emoji { font-size:2.2rem; flex-shrink:0; }
.sent-text { flex:1; }
.sent-en { font-size:1.1rem; font-weight:800; color:var(--dark); margin-bottom:4px; }
.sent-kn { font-family:'Noto Sans Kannada',sans-serif; font-size:0.98rem; font-weight:700; color:var(--orange); margin-bottom:3px; }
.sent-pronun { font-size:0.82rem; color:#999; font-style:italic; }
.sent-say { background:var(--yellow); border:2px solid var(--dark); border-radius:30px; padding:6px 14px; font-family:'Baloo 2',cursive; font-size:0.88rem; font-weight:700; cursor:pointer; box-shadow:2px 2px 0 var(--dark); flex-shrink:0; transition:all 0.15s; }
.sent-say:hover { transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--dark); }

/* ── MODAL ── */
.modal-overlay { display:none; position:fixed; inset:0; background:#0007; z-index:100; align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal { background:#fff; border:4px solid var(--dark); border-radius:28px; padding:30px 26px; text-align:center; max-width:340px; width:90%; box-shadow:8px 8px 0 var(--dark); animation:popIn 0.3s cubic-bezier(.36,1.4,.64,1); }
.modal-emoji { font-size:4.5rem; display:block; margin-bottom:10px; }
.modal-en { font-size:1.9rem; font-weight:800; color:var(--dark); }
.modal-kn { font-family:'Noto Sans Kannada',sans-serif; font-size:1.5rem; font-weight:700; color:var(--orange); margin:5px 0 3px; }
.modal-pronun { font-size:0.95rem; color:#777; margin-bottom:18px; }
.close-btn { background:var(--pink); border:3px solid var(--dark); border-radius:50px; padding:9px 24px; font-family:'Baloo 2',cursive; font-size:1rem; font-weight:800; cursor:pointer; color:#fff; box-shadow:4px 4px 0 var(--dark); transition:all 0.15s; }
.close-btn:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--dark); }

/* ── ALPHABET SECTION ── */
#alphabetSection { display:none; max-width:920px; margin:0 auto; padding:10px 18px 40px; }
#alphabetSection.show { display:block; }
#alphabetGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:14px; padding:10px 0; }
.alpha-card { background:#fff; border:3px solid var(--dark); border-radius:20px; padding:14px 10px 12px; text-align:center; cursor:pointer; box-shadow:5px 5px 0 var(--dark); transition:transform 0.15s,box-shadow 0.15s; animation:popIn 0.4s cubic-bezier(.36,1.4,.64,1) both; }
.alpha-card:hover { transform:translate(-3px,-3px); box-shadow:8px 8px 0 var(--dark); }
.alpha-card:active { transform:translate(2px,2px); box-shadow:2px 2px 0 var(--dark); }
.alpha-card.bounce { animation:bounce 0.4s cubic-bezier(.36,1.6,.64,1); }
.alpha-letter { font-size:2.4rem; font-weight:800; line-height:1; -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:4px; display:block; }
.alpha-emoji { font-size:1.8rem; display:block; margin-bottom:4px; }
.alpha-word { font-size:0.9rem; font-weight:800; color:var(--dark); }
.alpha-kn { font-family:'Noto Sans Kannada',sans-serif; font-size:0.8rem; font-weight:700; color:var(--orange); }

/* ── QUIZ SECTION ── */
#quizSection { display:none; max-width:600px; margin:0 auto; padding:10px 18px 40px; }
#quizSection.show { display:block; }
.quiz-score-row { display:flex; justify-content:center; gap:16px; margin-bottom:14px; flex-wrap:wrap; }
.quiz-score-pill { background:#fff; border:3px solid var(--dark); border-radius:50px; padding:6px 20px; font-weight:800; font-size:0.95rem; box-shadow:3px 3px 0 var(--dark); }
.quiz-score-pill.correct { color:var(--green); }
.quiz-score-pill.wrong   { color:var(--red); }
.quiz-score-pill.total   { color:var(--blue); }
.quiz-cat-select { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:18px; }
.quiz-cat-btn { background:#fff; border:2px solid var(--dark); border-radius:50px; padding:5px 14px; font-family:'Baloo 2',cursive; font-size:0.85rem; font-weight:700; cursor:pointer; box-shadow:2px 2px 0 var(--dark); transition:all 0.15s; color:var(--dark); }
.quiz-cat-btn.active { background:var(--dark); color:#fff; }
.quiz-cat-btn:hover { transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--dark); }
.quiz-card { background:#fff; border:3px solid var(--dark); border-radius:24px; padding:28px 20px 22px; text-align:center; box-shadow:6px 6px 0 var(--dark); animation:popIn 0.4s cubic-bezier(.36,1.4,.64,1); }
.quiz-question-label { font-size:0.78rem; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:#aaa; margin-bottom:10px; }
.quiz-emoji { font-size:5rem; display:block; margin-bottom:12px; }
.quiz-kn { font-family:'Noto Sans Kannada',sans-serif; font-size:1.5rem; font-weight:700; color:var(--orange); margin-bottom:6px; }
.quiz-hint { font-size:0.85rem; color:#aaa; margin-bottom:20px; font-style:italic; }
.quiz-options { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:10px; }
.quiz-opt { background:#fff; border:3px solid var(--dark); border-radius:16px; padding:14px 10px; font-family:'Baloo 2',cursive; font-size:1.05rem; font-weight:800; cursor:pointer; box-shadow:4px 4px 0 var(--dark); transition:all 0.15s; color:var(--dark); text-align:center; }
.quiz-opt:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--dark); }
.quiz-opt.correct-ans { background:var(--green); color:#fff; border-color:#3a8a3a; box-shadow:4px 4px 0 #3a8a3a; transform:scale(1.05); }
.quiz-opt.wrong-ans   { background:var(--red); color:#fff; border-color:#a0001e; box-shadow:4px 4px 0 #a0001e; }
.quiz-result { font-size:1.4rem; font-weight:800; margin-top:16px; animation:popIn 0.3s cubic-bezier(.36,1.6,.64,1); min-height:2rem; }
.quiz-next-btn { background:var(--yellow); border:3px solid var(--dark); border-radius:50px; padding:12px 36px; font-family:'Baloo 2',cursive; font-size:1.1rem; font-weight:800; cursor:pointer; box-shadow:4px 4px 0 var(--dark); transition:all 0.15s; margin-top:14px; display:none; }
.quiz-next-btn:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--dark); }
.quiz-next-btn.show { display:inline-block; }
.quiz-finish { text-align:center; padding:30px 20px; background:#fff; border:3px solid var(--dark); border-radius:24px; box-shadow:6px 6px 0 var(--dark); animation:popIn 0.4s cubic-bezier(.36,1.4,.64,1); }
.quiz-finish-emoji { font-size:4rem; display:block; margin-bottom:10px; }
.quiz-finish-title { font-size:1.8rem; font-weight:800; margin-bottom:8px; }
.quiz-finish-score { font-size:1.1rem; color:#555; margin-bottom:20px; }
.quiz-restart-btn { background:var(--green); border:3px solid var(--dark); border-radius:50px; padding:12px 32px; font-family:'Baloo 2',cursive; font-size:1.05rem; font-weight:800; cursor:pointer; color:#fff; box-shadow:4px 4px 0 var(--dark); transition:all 0.15s; }
.quiz-restart-btn:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--dark); }

#wordsSection.hide { display:none; }
</style>
</head>
<body>

<header id="mainHeader">
  <div class="header-row">
    <img src="images/kid1.png" class="hero-img left" alt="kid">
    <div class="title-block">
      <div class="title-wrap">
        <h1>Koppal - Kids</h1>
      </div>
      <p>ಇಂಗ್ಲಿಷ್ ಕಲಿಯೋಣ!</p>
      <p>Learn English with Kannada. Click on any card!</p>
    </div>
    <img src="images/kid2.png" class="hero-img right" alt="kid">
  </div>
</header>

<div class="mode-tabs">
  <button class="mode-tab"        id="tabAlphabet"  onclick="switchMode('alphabet')">🔤 A-Z</button>
  <button class="mode-tab active" id="tabWords"     onclick="switchMode('words')">📖 Words</button>
  <button class="mode-tab"        id="tabSentences" onclick="switchMode('sentences')">💬 Sentences</button>
  <button class="mode-tab"        id="tabQuiz"      onclick="switchMode('quiz')">🎯 Quiz</button>
</div>

<div class="score-bar" id="scoreBar">⭐ Stars collected: <span id="starCount">0</span></div>

<div id="wordsSection">
  <div class="category-bar" id="catBar"></div>
  <div class="grid" id="grid"></div>
</div>

<div id="sentencesSection">
  <div class="sent-cat-bar" id="sentCatBar"></div>
  <div class="sent-list" id="sentList"></div>
</div>

<div id="alphabetSection">
  <div id="alphabetGrid"></div>
</div>

<div id="quizSection">
  <div id="quizBox"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <span class="modal-emoji" id="mEmoji"></span>
    <div class="modal-en" id="mEn"></div>
    <div class="modal-kn" id="mKn"></div>
    <div class="modal-pronun" id="mPronun"></div>
    <button class="close-btn" id="closeBtn">✓ OK!</button>
  </div>
</div>

<footer>
  Made with <span class="footer-hearts">❤️</span> for little learners<br>
  <p style="font-size:0.88rem;">
    Created by <span class="credit-name">Gavisiddappa HATTI</span>
    &nbsp;with the help of <strong style="color:#4D96FF;">Claude 🤖</strong>
  </p>
  <p style="font-size:0.85rem;">
    📞 For advice or feedback:
    <a id="whatsapp-link" href="#" style="color:#25D366;text-decoration:none;">
      Send a WhatsApp Message
    </a>
  </p>
</footer>

<script>

const words = {
  Animals: [
    { en:"Cat",          kn:"ಬೆಕ್ಕು",       pronun:"ಕ್ಯಾಟ್",          emoji:"🐱" },
    { en:"Dog",          kn:"ನಾಯಿ",         pronun:"ಡಾಗ್",            emoji:"🐶" },
    { en:"Cow",          kn:"ಹಸು",          pronun:"ಕೌ",              emoji:"🐄" },
    { en:"Elephant",     kn:"ಆನೆ",          pronun:"ಎಲಿಫಂಟ್",         emoji:"🐘" },
    { en:"Fish",         kn:"ಮೀನು",         pronun:"ಫಿಶ್",            emoji:"🐟" },
    { en:"Lion",         kn:"ಸಿಂಹ",         pronun:"ಲಯನ್",            emoji:"🦁" },
    { en:"Tiger",        kn:"ಹುಲಿ",         pronun:"ಟೈಗರ್",           emoji:"🐯" },

function switchMode(mode) {
  currentMode = mode;
  ["Words","Sentences","Alphabet","Quiz"].forEach(m => {
    const tab = document.getElementById("tab"+m);
    if(tab) tab.classList.toggle("active", mode === m.toLowerCase());
  });
  document.getElementById("wordsSection").classList.toggle("hide", mode !== "words");
  document.getElementById("sentencesSection").classList.toggle("show", mode === "sentences");
  document.getElementById("alphabetSection").classList.toggle("show", mode === "alphabet");
  document.getElementById("quizSection").classList.toggle("show", mode === "quiz");
  if (mode === "alphabet") renderAlphabet();
  if (mode === "quiz") initQuiz();
}

let showAllCats = false;
//const visibleLimit = 6;
const visibleLimit = window.innerWidth < 600 ? 4 : 6;
//👉 Mobile = 4
//👉 Desktop = 6

function renderCats() {
  const bar = document.getElementById("catBar");
  bar.innerHTML = "";

  const allCats = Object.keys(words);
  const catsToShow = showAllCats ? allCats : allCats.slice(0, visibleLimit);

  catsToShow.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (cat === currentCat ? " active" : "");
    btn.dataset.cat = cat;
    btn.textContent = catEmoji(cat) + " " + cat;

    btn.onclick = () => {
      currentCat = cat;
      renderCats();
      renderGrid();
    };

    bar.appendChild(btn);
  });

  // ➕ More / ➖ Less button
  if (allCats.length > visibleLimit) {
    const toggleBtn = document.createElement("button");
    toggleBtn.className = "cat-btn";
    toggleBtn.textContent = showAllCats ? "➖ Less" : "➕ More";

    toggleBtn.onclick = () => {
      showAllCats = !showAllCats;
      renderCats();
    };

    bar.appendChild(toggleBtn);
  }
}

function catEmoji(cat) {
  return {Animals:"🐾",Fruits:"🍓",Vegetables:"🥦",Colors:"🎨",Body:"🙋",Home:"🏠",Food:"🍽️",Birds:"🐦",Flowers:"🌸",Festivals:"🎉",Numbers:"🔢",Transport:"🚗",Games:"🏏"}[cat] || "📌";
}
function renderGrid() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  words[currentCat].forEach((w, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.animationDelay = (i * 0.06) + "s";
    const badge = document.createElement("div");
    badge.className = "card-badge";
    badge.style.background = catColors[currentCat];
    badge.textContent = currentCat[0];
    card.appendChild(badge);
    if (w.color) {
      const sw = document.createElement("div");
      sw.className = "swatch"; sw.style.background = w.color; sw.textContent = w.emoji;
      card.appendChild(sw);
    } else {
      const em = document.createElement("span");
      em.className = "card-emoji"; em.textContent = w.emoji;
      card.appendChild(em);
    }
    const en = document.createElement("div"); en.className = "card-en"; en.textContent = w.en; card.appendChild(en);
    const kn = document.createElement("div"); kn.className = "card-kn"; kn.textContent = w.kn; card.appendChild(kn);
    card.onclick = () => openModal(w, card);
    grid.appendChild(card);
  });
}
function openModal(w, card) {
  document.getElementById("mEmoji").textContent = w.emoji;
  document.getElementById("mEn").textContent = w.en;
  document.getElementById("mKn").textContent = w.kn;
  document.getElementById("mPronun").textContent = "🔤 ಉಚ್ಚಾರಣೆ: " + w.pronun;
  document.getElementById("modalOverlay").classList.add("show");
  speakText(w.en);
  const key = w.en + currentCat;
  if (!seen.has(key)) { seen.add(key); stars++; document.getElementById("starCount").textContent = stars; addStar(); }
  card.classList.remove("bounce"); void card.offsetWidth; card.classList.add("bounce");
}

function renderSentCats() {
  const bar = document.getElementById("sentCatBar");
  bar.innerHTML = "";

  const allCats = Object.keys(sentences);
  const catsToShow = showAllSCats ? allCats : allCats.slice(0, sVisibleLimit);

  catsToShow.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "sent-cat-btn" + (cat === currentSCat ? " active" : "");
    btn.dataset.scat = cat;
    btn.textContent = sentCatEmoji(cat) + " " + cat;

    btn.onclick = () => {
      currentSCat = cat;
      renderSentCats();
      renderSentences();
    };

    bar.appendChild(btn);
  });

  // ➕ More / ➖ Less button
  if (allCats.length > sVisibleLimit) {
    const toggleBtn = document.createElement("button");
    toggleBtn.className = "sent-cat-btn";
    toggleBtn.textContent = showAllSCats ? "➖ Less" : "➕ More";

    toggleBtn.onclick = () => {
      showAllSCats = !showAllSCats;
      renderSentCats();
    };

    bar.appendChild(toggleBtn);
  }
}
function sentCatEmoji(cat) {
  return {"Animals & Nature":"🐾","Family & People":"👨‍👩‍👧","Food & Eating":"🍽️","School & Playing":"🏫","Vegetables & Fruits":"🥦","Birds & Flowers":"🌸","Festivals 🎉":"🎊","Numbers 🔢":"🔢","Transport 🚗":"🚗"}[cat] || "💬";
}
function renderSentences() {
  const list = document.getElementById("sentList");
  list.innerHTML = "";
  sentences[currentSCat].forEach((s, i) => {
    const card = document.createElement("div");
    card.className = "sent-card";
    card.style.animationDelay = (i * 0.07) + "s";
    const emo = document.createElement("div"); emo.className = "sent-emoji"; emo.textContent = s.emoji; card.appendChild(emo);
    const txt = document.createElement("div"); txt.className = "sent-text";
    const en = document.createElement("div"); en.className = "sent-en"; en.textContent = s.en; txt.appendChild(en);
    const kn = document.createElement("div"); kn.className = "sent-kn"; kn.textContent = s.kn; txt.appendChild(kn);
    const pr = document.createElement("div"); pr.className = "sent-pronun"; pr.textContent = "📢 " + s.pronun; txt.appendChild(pr);
    card.appendChild(txt);
    const sayBtn = document.createElement("button");
    sayBtn.className = "sent-say"; sayBtn.textContent = "🔊 Say!";
    sayBtn.onclick = (e) => { e.stopPropagation(); speakText(s.en); };
    card.appendChild(sayBtn);
    card.onclick = () => {
      const key = "sent_" + s.en;
      if (!seen.has(key)) { seen.add(key); stars++; document.getElementById("starCount").textContent = stars; addStar(); }
      card.classList.remove("bounce"); void card.offsetWidth; card.classList.add("bounce");
      speakText(s.en);
    };
    list.appendChild(card);
  });
}

function speakText(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = 0.8; u.pitch = 1.2;
  speechSynthesis.speak(u);
}
function addStar() {
  const bar = document.getElementById("scoreBar");
  const s = document.createElement("span"); s.className = "star"; s.textContent = "⭐"; bar.appendChild(s);
  setTimeout(() => s.remove(), 1000);
}

// ── QUIZ MODE ──
let quizCat = "Animals";
let quizWords = [];
let quizIndex = 0;
let quizCorrect = 0;
let quizWrong = 0;
let quizAnswered = false;
const QUIZ_TOTAL = 10;

// ⭐ CATEGORY CONTROL
let showAllQuizCats = false;
const quizVisibleLimit = window.innerWidth < 600 ? 3 : 4;

// ⭐ PROGRESS STORAGE
let quizProgress = JSON.parse(localStorage.getItem("quizProgress") || "{}");

// ── INIT ──
function initQuiz() {
  quizCorrect = 0;
  quizWrong = 0;
  quizIndex = 0;
  quizAnswered = false;
  renderQuizUI();
}

// ── NEXT CATEGORY ──
function goToNextCategory() {
  const allCats = Object.keys(words);
  let currentIndex = allCats.indexOf(quizCat);
  const nextIndex = (currentIndex + 1) % allCats.length;

  quizCat = allCats[nextIndex];
  initQuiz();
}

// ── UI ──
function renderQuizUI() {
  const box = document.getElementById("quizBox");

  quizWords = shuffle([...words[quizCat]]).slice(0, QUIZ_TOTAL);

  box.innerHTML = `
    <div style="text-align:center; margin-bottom:10px;">
      <div class="quiz-score-row">
        <div class="quiz-score-pill correct">⭐ <span id="qStars">0</span></div>
        <div class="quiz-score-pill correct">✅ <span id="qCorrect">0</span></div>
        <div class="quiz-score-pill wrong">❌ <span id="qWrong">0</span></div>
        <div class="quiz-score-pill total">📝 <span id="qIndex">1</span>/${QUIZ_TOTAL}</div>
      </div>
      <div class="quiz-cat-select" id="quizCatSelect"></div>
    </div>
    <div id="quizCardArea"></div>
  `;

  // 🎯 CATEGORY BAR
  const catSelect = document.getElementById("quizCatSelect");
  catSelect.innerHTML = "";

  const allCats = Object.keys(words);

  const catsToShow = showAllQuizCats
    ? allCats
    : allCats.slice(0, quizVisibleLimit);

  catsToShow.forEach((cat, index) => {
    const isLocked = index > 0 && !quizProgress[allCats[index - 1]];

    const btn = document.createElement("button");
    btn.className =
      "quiz-cat-btn" +
      (cat === quizCat ? " active" : "") +
      (isLocked ? " locked" : "");

    const stars = quizProgress[cat] ? "⭐" : "";
    btn.textContent = (isLocked ? "🔒 " : "") + cat + " " + stars;

    btn.onclick = () => {
      if (isLocked) return;

      quizCat = cat;
      initQuiz();
    };

    catSelect.appendChild(btn);
  });

  // ➕ More / Less
  if (allCats.length > quizVisibleLimit) {
    const toggleBtn = document.createElement("button");
    toggleBtn.className = "quiz-cat-btn";
    toggleBtn.textContent = showAllQuizCats ? "➖ Less" : "➕ More";

    toggleBtn.onclick = () => {
      showAllQuizCats = !showAllQuizCats;
      renderQuizUI();
    };

    catSelect.appendChild(toggleBtn);
  }

  renderQuestion();
}

// ── SHUFFLE ──
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ── SCORE ──
function updateQuizScore() {
  const c = document.getElementById("qCorrect");
  const w = document.getElementById("qWrong");
  const i = document.getElementById("qIndex");
  const s = document.getElementById("qStars");

  if (c) c.textContent = quizCorrect;
  if (w) w.textContent = quizWrong;
  if (i) i.textContent = Math.min(quizIndex + 1, QUIZ_TOTAL);

  if (s) {
    const stars = quizProgress[quizCat] ? "⭐" : "0";
    s.textContent = stars;
  }
}

// ── CHECK ANSWER ──
function checkAnswer(selected, correct, btn) {
  if (quizAnswered) return;

  quizAnswered = true;

  // Disable all buttons and mark correct/wrong
  document.querySelectorAll(".quiz-opt").forEach(b => {
    b.disabled = true;

    if (b.textContent === correct) {
      b.classList.add("correct");
    } else if (b === btn && selected !== correct) {
      b.classList.add("wrong");
    }
  });

  const result = document.getElementById("quizResult");
  const nextBtn = document.getElementById("quizNextBtn");

  if (selected === correct) {
    quizCorrect++;
    result.textContent = "✅ Correct! ಸರಿಯಾಗಿದೆ!";
    result.style.color = "#6BCB77";
    speakText("Correct! " + correct);
  } else {
    quizWrong++;
    result.textContent = "❌ It is " + correct + "!";
    result.style.color = "#FF4D6D";
    speakText("The answer is " + correct);
  }

  updateQuizScore();

  if (nextBtn) {
    nextBtn.disabled = false;
    nextBtn.style.display = "inline-block";  // ensure visible
  }
}

// ── NEXT QUESTION ──
function nextQuestion() {
  if (!quizAnswered) return; // block skipping without answer

  quizIndex++;
  renderQuestion();
}

// ── RENDER QUESTION ──
function renderQuestion() {
  const area = document.getElementById("quizCardArea");
  if (!area) return;

  if (quizIndex >= QUIZ_TOTAL || quizIndex >= quizWords.length) {
    const pct = Math.round((quizCorrect / QUIZ_TOTAL) * 100);

    // ⭐ SAVE PROGRESS
    if (pct >= 90) {
      quizProgress[quizCat] = true;
      localStorage.setItem("quizProgress", JSON.stringify(quizProgress));
    }

    const trophy =
      pct >= 90 ? "🏆" :
      pct >= 70 ? "🥇" :
      pct >= 50 ? "🥈" : "🎯";

    const msg =
      pct >= 90 ? "Excellent! ಭಲೇ!" :
      pct >= 70 ? "Well done! ಚೆನ್ನಾಗಿದೆ!" :
      pct >= 50 ? "Good try! ಮತ್ತೆ ಪ್ರಯತ್ನಿಸು!" :
                  "Keep learning! ಕಲಿಯುತ್ತಿರು!";

    area.innerHTML = `
      <div class="quiz-finish">
        <span class="quiz-finish-emoji">${trophy}</span>
        <div class="quiz-finish-title">${msg}</div>
        <div class="quiz-finish-score">
          ✅ ${quizCorrect} / ${QUIZ_TOTAL} (${pct}%)
        </div>

        ${
          pct >= 90
            ? `<button class="quiz-restart-btn" onclick="goToNextCategory()">➡ Next Category</button>`
            : `<button class="quiz-restart-btn" onclick="initQuiz()">🔄 Try Again</button>`
        }
      </div>
    `;

    //if (pct >= 90) {
    //  setTimeout(goToNextCategory, 2000);
    //}

    return;
  }

  const w = quizWords[quizIndex];
  quizAnswered = false;

  const others = shuffle(
    words[quizCat].filter(x => x.en !== w.en)
  ).slice(0, 3);

  const options = shuffle([w, ...others]);

  speakText(w.en);

  area.innerHTML = `
    <div class="quiz-card">
      <div class="quiz-question-label">What is this in English?</div>
      <span class="quiz-emoji">${w.emoji}</span>
      <div class="quiz-kn">${w.kn}</div>
      <div class="quiz-hint">ಇದು ಇಂಗ್ಲಿಷ್‌ನಲ್ಲಿ ಏನು?</div>

      <div class="quiz-options" id="quizOptions"></div>
      <div class="quiz-result" id="quizResult"></div>

      <button class="quiz-next-btn" id="quizNextBtn" onclick="nextQuestion()" disabled style="display:none; margin:15px auto;">
        Next ▶
      </button>
    </div>
  `;

  const optContainer = document.getElementById("quizOptions");

  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "quiz-opt";
    btn.textContent = opt.en;
    btn.onclick = () => checkAnswer(opt.en, w.en, btn);
    optContainer.appendChild(btn);
  });

  updateQuizScore();
}

  quizAnswered = true;

  // Disable all option buttons and mark correct/wrong
  document.querySelectorAll(".quiz-opt").forEach(b => {

    b.style.cursor = "default";

      b.classList.add("correct-ans");
    } else if (b === btn && chosen !== correct) {
      b.classList.add("wrong-ans");
    }
  });

  const result = document.getElementById("quizResult");
  const nextBtn = document.getElementById("quizNextBtn");

  if (chosen === correct) {
    quizCorrect++;
    result.textContent = "✅ Correct! ಸರಿಯಾಗಿದೆ!";
    result.style.color = "#6BCB77";
    speakText("Correct! " + correct);

    // If you have stars and addStar, define them; else comment/remove:
    // stars++;
    // document.getElementById("starCount").textContent = stars;
    // addStar();

  } else {
    quizWrong++;
    result.textContent = "❌ It is " + correct + "!";
    result.style.color = "#FF4D6D";
    speakText("The answer is " + correct);
  }

  updateQuizScore();

  // Show and enable Next button
  if (nextBtn) {
    nextBtn.disabled = false;
    nextBtn.style.display = "inline-block";
  }
}

function nextQuestion() {
  if (!quizAnswered) return;  // Prevent skipping

  quizIndex++;
  renderQuestion();
  updateQuizScore();
}

(function() {
  const header = document.getElementById("mainHeader");
  if (!header) return;
  const colors = ["#FF6B35","#FFD93D","#FF85A1","#C77DFF","#4D96FF","#6BCB77","#2EC4B6"];
  const shapes = ["⭐","✨","💫","🌟","⚡","🎈","🎀"];
  function createSpark() {
    const el = document.createElement("div");
    el.className = "spark";
    const size = Math.random()*16+8;
    if (Math.random() > 0.5) {
      el.textContent = shapes[Math.floor(Math.random()*shapes.length)];
      el.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;position:absolute;pointer-events:none;font-size:${size}px;animation:sparkFloat ${Math.random()*2+1.5}s linear infinite;animation-delay:${Math.random()*3}s;opacity:0;`;
    } else {
      el.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${Math.random()*2+1.5}s;animation-delay:${Math.random()*3}s;opacity:0;`;
    }
    header.appendChild(el);
    setTimeout(() => el.remove(), 5000);
  }
  setInterval(createSpark, 300);
  for(let i=0;i<8;i++) setTimeout(createSpark, i*150);
})();
